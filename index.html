<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>NAGAYAMA LAB — 野球人生物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#141b38;--panel2:#1b2550;--line:#8fa4ff;--tx:#f2f5ff;--dim:#9aa6d6;--pink:#ff5fa2;--green:#7dff9b;--gold:#ffd23f;--red:#ff5d5d;--blue:#58b7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'DotGothic16','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#app{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;background:#0a0f26;border-bottom:3px solid #26336b;gap:8px;min-height:34px}
#top b{color:var(--gold)}#top .r{text-align:right;color:var(--dim)}
#stage{position:relative;width:100%;background:#000;border-bottom:3px solid #26336b;flex:none}
#cv{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:16/9;background:#000}
#board{position:absolute;left:0;top:0;right:0;font-size:10px;line-height:1.15;pointer-events:none}
#board table{border-collapse:collapse;background:rgba(5,10,30,.82);margin:3px;color:#fff;font-size:10px}
#board td,#board th{padding:1px 3px;text-align:center;min-width:13px;border:1px solid rgba(143,164,255,.25)}
#board td.nm{text-align:left;min-width:62px;max-width:70px;overflow:hidden;white-space:nowrap}
#board .act{color:var(--gold);font-weight:bold}
#board .cnt{position:absolute;right:4px;top:3px;background:rgba(5,10,30,.82);padding:3px 6px;border:1px solid rgba(143,164,255,.25);font-size:10px;text-align:right}
#board .o{color:#ff5d5d}#board .rn{color:#7dff9b}
#toast{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;pointer-events:none}
.chip{background:rgba(10,15,38,.92);border:2px solid var(--green);color:var(--green);padding:2px 7px;font-size:12px;animation:chip 2.6s forwards}
.chip.neg{border-color:var(--red);color:var(--red)}.chip.info{border-color:var(--gold);color:var(--gold)}
@keyframes chip{0%{transform:translateY(8px);opacity:0}12%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:fl .5s}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:30px;color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;pointer-events:none;opacity:0;letter-spacing:2px}
#banner.on{animation:bn 1.8s forwards}@keyframes bn{0%{opacity:0;transform:scale(1.6)}14%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#mid{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:8px 10px 6px;gap:8px}
#tb{background:var(--panel);border:3px solid #e9edff;box-shadow:0 0 0 3px #26336b,inset 0 0 0 2px #0a0f26;padding:8px 10px;min-height:92px;position:relative;flex:none}
#pt{float:left;display:flex;flex-direction:column;gap:4px;margin:0 9px 2px 0}#tb::after{content:'';display:block;clear:both}#pt:empty{display:none}#pt .pti{text-align:center;font-size:10px;color:var(--dim)}#pt canvas{width:48px;height:48px;image-rendering:pixelated;border:2px solid #5a6cc0;display:block;margin:0 auto 1px;background:#26304f}
#ttl{color:var(--gold);font-size:14px;margin-bottom:3px;min-height:0}
#ttl:empty{display:none}
#txt{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
#txt .mk{color:var(--pink)}
#gloss{margin-top:7px;border:2px dashed #5a6cc0;padding:5px 8px;font-size:12px;line-height:1.5;color:#cdd7ff;background:rgba(40,56,120,.35)}
#gloss:empty{display:none}
#acts{display:flex;flex-direction:column;gap:7px;flex:none}
.btn{width:100%;text-align:left;background:var(--panel2);border:3px solid var(--line);padding:9px 11px;font-size:14px;line-height:1.35;cursor:pointer;position:relative;box-shadow:0 3px 0 #0a0f26;transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0f26}
.btn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.btn .n{color:var(--gold);margin-right:6px}
.btn.pri{border-color:var(--gold);text-align:center;background:#3a3010}
.btn.ok{border-color:var(--green)}.btn.dim{opacity:.55}
.btn:disabled{opacity:.4}
.row{display:flex;gap:7px}.row .btn{flex:1}
#nav{display:flex;border-top:3px solid #26336b;background:#0a0f26;flex:none;padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;background:none;border:0;border-right:2px solid #1b2550;color:var(--dim);font-size:12px;padding:9px 0;cursor:pointer}
#nav button:last-child{border-right:0}
#nav button:active{background:#1b2550;color:#fff}
#nav .on{color:var(--green)}
#modal{position:fixed;inset:0;background:rgba(3,6,18,.88);display:none;justify-content:center;z-index:50}
#modal.on{display:flex}
#mbox{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
#mhead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:3px solid #26336b;background:#0a0f26}
#mhead h2{margin:0;font-size:16px;color:var(--gold)}
#mtabs{display:flex;border-bottom:3px solid #26336b;background:#0a0f26;overflow-x:auto}
#mtabs button{flex:1;min-width:64px;background:none;border:0;border-right:2px solid #1b2550;color:var(--dim);font-size:12px;padding:9px 4px}
#mtabs .on{color:#0a0f26;background:var(--gold)}
#mbody{flex:1;overflow-y:auto;padding:10px;font-size:13px;line-height:1.55}
.card{background:var(--panel);border:2px solid #3a4a9a;padding:8px 10px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:14px;color:var(--gold)}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.bar .lb{width:62px;color:var(--dim)}.bar .tr{flex:1;height:10px;background:#0a0f26;border:1px solid #3a4a9a;position:relative}
.bar .fl{height:100%}.bar .rk{width:22px;text-align:center;font-weight:bold}.bar .vl{width:28px;text-align:right}
.bar .pt{position:absolute;top:-2px;width:2px;height:12px;background:#fff;opacity:.6}
table.tb{border-collapse:collapse;width:100%;font-size:11px}
table.tb th{background:#1b2550;color:var(--gold);padding:3px 4px;white-space:nowrap}
table.tb td{padding:3px 4px;border-bottom:1px solid #26336b;text-align:center;white-space:nowrap}
table.tb td:first-child,table.tb th:first-child{text-align:left}
.scroll-x{overflow-x:auto}
.pcard{display:flex;gap:10px;align-items:center}
.pcard canvas{width:64px;height:64px;image-rendering:pixelated;border:2px solid #3a4a9a;flex:none}
.hearts{color:var(--pink);letter-spacing:1px;font-size:12px}
.news{background:#f1ead2;color:#222;border:3px double #444;padding:8px 10px;margin-bottom:10px;font-family:'Hiragino Mincho ProN','Yu Mincho',serif}
.news .mast{font-size:11px;border-bottom:2px solid #222;margin-bottom:4px;display:flex;justify-content:space-between}
.news h4{margin:2px 0;font-size:17px;line-height:1.3}.news p{margin:3px 0;font-size:12px;line-height:1.6}
.tag{display:inline-block;background:#26336b;color:#cdd7ff;font-size:10px;padding:1px 6px;margin-right:4px}
#setup,#title{position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:30;display:none}
#setup.on,#title.on{display:block}
#title{background:#000}
#title img{width:100%;display:block;image-rendering:pixelated}
#title .tbtns{padding:10px 14px 24px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#000,#0b1020)}
#title .ver{font-size:11px;color:var(--dim);text-align:center;margin-top:2px}
.sp{padding:14px 12px 30px}
.sp h1{font-size:18px;color:var(--gold);margin:0 0 4px}.sp .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.sp label{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
.sp input,.sp select{width:100%;padding:10px;font-size:16px;background:#0a0f26;color:#fff;border:3px solid var(--line);font-family:inherit;border-radius:0}
.sp select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='10'><path d='M1 1l7 7 7-7' fill='none' stroke='%23ffd23f' stroke-width='3'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.sp select option{background:#0a0f26;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{background:var(--panel2);border:3px solid #3a4a9a;padding:7px 9px;font-size:12px;cursor:pointer;text-align:left;line-height:1.4}
.opt.sel{border-color:var(--gold);background:#3a3010}
.opt b{display:block;font-size:13px;color:#fff}.opt small{color:var(--dim);font-size:11px}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:5px;background:#26336b}.steps i.on{background:var(--gold)}
.stat-line{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px dotted #3a4a9a;padding:3px 0}
.big{font-size:22px;color:var(--gold)}
.center{text-align:center}
.hl{color:var(--gold)}.good{color:var(--green)}.bad{color:var(--red)}.dm{color:var(--dim)}
#brk{position:absolute;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column}
#brk.on{display:flex}
#brk .bh{padding:10px 12px 6px;border-bottom:3px solid #26336b}#brk .bh b{color:var(--gold);font-size:15px}#brk .bh div{color:var(--dim);font-size:11px;margin-top:2px}
#brk .bb{flex:1;overflow:auto;padding:8px 6px}#brk .bf{padding:8px 12px 14px;border-top:3px solid #26336b}
.brkw{overflow-x:auto;background:#0a0f26;border:2px solid #3a4a9a;padding:4px 0}
.brkleg{font-size:11px;color:var(--dim);margin:6px 2px;line-height:1.6}.brkleg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:3px}
#dft{position:absolute;inset:0;background:#0b1020;z-index:36;display:none;flex-direction:column}
#dft.on{display:flex}
#dft .bh{padding:10px 12px 6px;border-bottom:3px solid #26336b}#dft .bh b{color:var(--gold);font-size:15px}#dft .bh div{color:var(--dim);font-size:11px;margin-top:2px}
#dft .bb{flex:1;overflow:auto;padding:8px 6px}#dft .bf{padding:8px 12px 14px;border-top:3px solid #26336b}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dc{perspective:700px;height:156px}
.dc .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.dc.on .in{transform:rotateY(180deg)}
.dc .f,.dc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center}
.dc .f{background:repeating-linear-gradient(45deg,#1d2a5b,#1d2a5b 6px,#26336b 6px,#26336b 12px);justify-content:flex-start;padding:0 0 4px}
.dc .f .ft{width:100%;font-size:11px;font-weight:bold;padding:3px 0;color:#fff;text-shadow:0 1px 2px #000}.dc .f .fm{font-size:14px;color:#ffd23f;writing-mode:vertical-rl;letter-spacing:2px;flex:1;display:flex;align-items:center;justify-content:center}
.dc .b{background:#fafafa;color:#111;transform:rotateY(180deg);justify-content:flex-start}
.dc .b .tm{width:100%;color:#fff;font-size:11px;font-weight:bold;padding:3px 0;text-shadow:0 1px 2px #000}
.dc .b .nm{writing-mode:vertical-rl;font-size:17px;font-weight:bold;letter-spacing:2px;flex:1;display:flex;align-items:center;justify-content:center}
.dc .b .sc{font-size:9px;color:#444;padding-bottom:4px;line-height:1.3}
.dc.me .b{background:#fff3b0;border-color:#ffd23f;box-shadow:0 0 14px 4px rgba(255,210,63,.95)}
.dc.rv .b{border-color:#ff9d3b}
.dc.ct .b{border-color:#ff5d5d}
.dc.lose .b{background:#d8d8e0;color:#666}
@media (max-height:640px){#txt{font-size:14px}.btn{padding:7px 10px}}
@media (min-width:700px){#app{border-left:3px solid #26336b;border-right:3px solid #26336b}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div><b id="tN"></b> <span id="tA"></span></div><div class="r" id="tR"></div></div>
  <div id="stage"><canvas id="cv" width="320" height="180"></canvas><div id="board"></div><div id="toast"></div><div id="flash"></div><div id="banner"></div></div>
  <div id="mid"><div id="tb"><div id="pt"></div><div id="ttl"></div><div id="txt"></div><div id="gloss"></div></div><div id="acts"></div></div>
  <div id="nav"><button data-m="ab">能力</button><button data-m="rec">成績</button><button data-m="ppl">人物</button><button data-m="news">新聞</button><button data-m="mem">思い出</button><button id="bSnd">🔊</button></div>
  <div id="title"></div><div id="setup"></div><div id="dft"><div class="bh"><b id="dftT"></b><div id="dftS"></div></div><div class="bb"><div class="dgrid" id="dftG"></div></div><div class="bf"><button class="btn pri" id="dftOK">札をめくる ▶</button></div></div><div id="brk"><div class="bh"><b id="brkT"></b><div id="brkS"></div></div><div class="bb" id="brkB"></div><div class="bf"><button class="btn pri" id="brkOK">つぎへ ▶</button><button class="btn" id="brkSK" style="margin-top:6px;text-align:center;display:none">⏭ 大会をスキップ（結果まで）</button></div></div>
</div>
<div id="modal"><div id="mbox"><div id="mhead"><h2 id="mt"></h2><button class="btn" style="width:auto;padding:4px 12px" id="mx">✕ 閉じる</button></div><div id="mtabs"></div><div id="mbody"></div></div></div>

/* level: 'city'=市・地区大会(自地域8:隣接地域2) / 'pref'=県大会(5地域ほぼ均等)。recent=直近の相手市(重み×0.2) */
function pickCityBal(pref,home,level,recent){
  const R=SUBREG[pref];if(!R)return null;
  recent=recent||[];
  let hr=null;for(const r in R.r)if(R.r[r].includes(home))hr=r;
  const ws=[];let tot=0;
  for(const r in R.r){for(const c of R.r[r]){
    let w;
    if(level==='city'){
      const n=R.r[r].length;
      if(r===hr)w=c===home?2:6/Math.max(1,n-1);              /* 自地域: 合計8割(自市2+同地域6) */
      else if(hr&&R.near[hr].includes(r))w=(2/R.near[hr].length)/n; /* 隣接地域: 合計2割 */
      else w=.3/3/n;                                           /* それ以外: ごくまれ */
    }
    else{w=1/R.r[r].length;if(c===home)w*=.3;}
    if(recent.slice(-2).includes(c))w*=.2;
    ws.push([c,w]);tot+=w;
  }}
  let x=rnd()*tot;
  for(const [c,w] of ws){x-=w;if(x<=0)return c;}
  return ws[0][0];
}
/* 茨城以外: 全市区町村から人口規模の代理(市区10:町1.5:村.4)で重み抽選 */
function pickCityAny(pref,excl){
  const cs=(PREFS[pref]?PREFS[pref].c:[excl]).filter(x=>x!==excl);
  if(!cs.length)return excl;
  const w=c=>/[市区]$/.test(c)?10:/町$/.test(c)?1.5:.4;
  let tot=0;for(const c of cs)tot+=w(c);
  let x=rnd()*tot;for(const c of cs){x-=w(c);if(x<=0)return c;}
  return cs[0];
}
function pickOtherCity(pref,home){
  for(let i=0;i<12;i++){const c=pickCityBal(pref,home,'city',[]);if(c&&c!==home)return c;}
  return pickCityAny(pref,home);
}

function compile(T){
  const ch=T.ch.split(' '),bars=ch.length,total=bars*8;
  const lead=T.lead.split(' ');while(lead.length<total)lead.push('.');
  const ev=[];
  for(let i=0;i<total;i++){
    const bar=Math.floor(i/8),k=i%8,cm=chordMidi(ch[bar],3),cm2=chordMidi(ch[bar],4);
    const e={lead:null,bass:null,arp:null,dr:null,hold:0};
    const tk=lead[i];if(tk!=='-'&&tk!=='.'){let d=1;while(i+d<total&&lead[i+d]==='-')d++;e.lead={m:noteMidi(tk),d};}
    const bp=T.bass[k];if(bp==='r')e.bass=cm[0]-12;else if(bp==='5')e.bass=cm[2]-12;
    const ap=T.arp[k];if(ap>='1'&&ap<='3')e.arp=cm2[+ap-1];
    const dp=T.dr[k];e.dr=dp;ev.push(e);
  }
  return ev;
}
A.play=function(name){
  if(A.cur===name)return;A.stop();A.cur=name;if(!A.ctx||!TR[name])return;
  const T=TR[name];A.ev=compile(T);A.T=T;A.step=0;A.nt=A.ctx.currentTime+.08;A.sd=60/T.bpm/2;
  const tick=()=>{
    if(!A.ctx||A.cur!==name)return;
    while(A.nt<A.ctx.currentTime+.3){
      const e=A.ev[A.step],t=A.nt,d=A.sd,w=A.T.wave;
      if(e.lead)A.tone(mtof(e.lead.m),t,e.lead.d*d*.95,w,.13,A.b);
      if(e.bass)A.tone(mtof(e.bass),t,d*1.6,'triangle',.3,A.b);
      if(e.arp)A.tone(mtof(e.arp),t,d*.9,'square',.035,A.b);
      const p=e.dr;
      if(p==='k'||p==='x'){A.tone(150,t,.12,'sine',.38,A.b,.35);}
      if(p==='s'){A.noise(t,.1,.2,1800,.8,'bandpass',A.b);}
      if(p==='h'||p==='x'){A.noise(t,.03,.08,7000,1,'highpass',A.b);}
      A.nt+=d;A.step=(A.step+1)%A.ev.length;
    }
  };
  tick();A.tm=setInterval(tick,60);
};
A.stop=function(){if(A.tm){clearInterval(A.tm);A.tm=null;}A.cur=null;};

const _sn={};
function snap(col){

  let best=0,bd=1e9;for(let i=0;i<NESP.length;i++){const p=NESP[i];const dr=R-p[0],dg=G-p[1],db=B-p[2];const d=dr*dr*.9+dg*dg*1.2+db*db*.8;if(d<bd){bd=d;best=i;}}

}

let EXC=0;

const FANCOL=['#ef4444','#3b82f6','#facc15','#22c55e','#f8fafc','#a855f7','#fb923c'];
function drawStandCrowd(r,x0,x1,rowY,dens,g,jitter){
  // rowY(x)=最上段のy。5段ぶんの観客を描く。dens 0〜1(がらがら〜満員)
  const myU=(g&&g.myUni)||['#1d4ed8','#fff'],opU=(g&&g.oppUni)||['#dc2626','#fff'];
  for(let x=x0;x<x1;x+=3){const y=rowY(x);
    for(let yy=y;yy<y+(jitter===0?4:16);yy+=4){
      const rv=r(),rc=r();
      if(rv>=dens){rect(x,yy+2,2,2,K('#4d5b8c'));continue;}
      const side=x<GW*.32?1:x>GW*.68?2:0;
      const col=side===1?myU[0]:side===2?opU[0]:FANCOL[(rc*FANCOL.length)|0];
      const wave=EXC>.7&&Math.abs(((NOW/7)%(GW+80))-x)<24;
      const stand=EXC>1.0||wave;
      const th=(.62-EXC*.85);
      const up=stand?-2:(Math.sin(NOW/(170+(x*7%5)*40)+x)>th?(EXC>.5?-2:-1):0);
      rect(x,yy+up,2,2,K('#f1c79a'));rect(x,yy+2+up,2,stand?3:2,K(col));
      if(stand&&side&&rc>.3){rect(x-1,yy-2+up,1,3,K('#f1c79a'));rect(x+2,yy-3+up,1,3,K('#f1c79a'));}
      if(EXC>.4&&(((NOW/90)|0)+x*3+yy)%53===0)rect(x,yy-1,1,1,'#ffffff');
      if(side&&EXC>.4&&rc>.6)rect(x+(side===1?2:-1),yy-2+up,1,2,K(side===1?myU[1]:opU[1]));
    }
  }
}

const POTBASE=62;
function genStats(type,pos,rr){
  const T0=TYPES[type],st=emptySt(),pot={};
  for(const k of STK){
    let v=13+gauss()*2.2;
    if(T0.b.all)v+=T0.b.all;if(T0.b[k])v+=T0.b[k];
    const pb=POSBIAS[pos];if(pb&&pb[k])v+=pb[k]*.8;
    if(pos!=='P'&&['velo','ctl','brk'].includes(k))v=8+gauss()*2+(k==='velo'?st.arm*.0:0);
    if(pos!=='P'&&k==='sta')v=12+gauss()*2;
    st[k]=clamp(v,5,45);
    let p=POTBASE+gauss()*6;if(T0.pot.all)p+=T0.pot.all;if(T0.pot[k])p+=T0.pot[k];
    if(pb&&pb[k])p+=pb[k]*1.5;
    pot[k]=clamp(p,52,99);
  }
  if(pos!=='P'){st.velo=clamp(st.arm*.8,5,40);pot.velo=clamp(pot.arm-8,45,92);}
  return {st,pot};
}

/* 既存の場面が実際に発生した後で添える。候補・選択・本編RNGを変えない。
   この回想は開始事実の中に残し、S.memの上限や再会候補の文字列検索から独立させる。 */
function startConnect(contact,pid,text){
  const r=startReason();if(!r||r.contact!==contact)return text;
  if(r.actor&&S.start.personId!==pid)return text;
  if(!S.world||!S.world.persons[pid]||S.start.recalled)return text;
  const recall=startText('recall');if(!recall)return text;
  if(!pwInTx())throw new Error('開始理由の回想はトランザクション内だけ');
  S.start.recalled={t:pwTick(),a:ageNow(),personId:pid,contact};
  return text+'\n'+recall;
}

  const n=lu.length,hs=lu.map(()=>({pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0}));
  const ord=lu.map((p,i)=>i).sort((a,b)=>(lu[b].b+lu[b].pw*.4)-(lu[a].b+lu[a].pw*.4));
  let H=Math.round(R*1.35+N*.17+.9+gauss()*1.0+adv*.04),BB=Math.round(1.1+N*.1+gauss()*1.1+adv*.03),K=Math.round(N*.7+gauss()*1.4-adv*.05);
  H=clamp(H,R>0?1:0,N*3);BB=clamp(BB,0,9);K=clamp(K,0,N*2);
  let HR=0;const q=.05*fence*(1+lu.reduce((a,p)=>a+p.pw,0)/n/25);for(let i=0;i<H;i++)if(rnd()<q)HR++;HR=Math.min(HR,R,H);
  let RBI=clamp(R-(chance(.2)?1:0),0,R);if(RBI<HR)HR=RBI;
  const PA=Math.max(N*3,N*3+H+BB-ri(0,1));
  const fi=fix?fix.idx:-1;
  if(fix){ // 主人公の実際の成績は、そのまま入れて、残りをその分だけ減らす
    const f=fix.line;H=Math.max(0,H-f.h);BB=Math.max(0,BB-f.bb);K=Math.max(0,K-f.k);HR=Math.max(0,HR-f.hr);RBI=Math.max(0,RBI-f.rbi);
  }
  const free=ord.filter(i=>i!==fi),paLeft=fix?Math.max(n-1,PA-fix.line.pa):PA;
  const base=Math.floor(paLeft/free.length),extra=paLeft%free.length;
  free.forEach((pi,k)=>{hs[pi].pa=base+(k<extra?1:0);});
  const wt=lu.map(p=>Math.exp(p.b/10));
  const put=(cnt,key,wf,capf)=>{for(let c=0;c<cnt;c++){const i=tWpick(lu.map((p,j)=>wf(p,j)),j=>j!==fi&&capf(hs[j]));if(i<0)break;hs[i][key]++;}};
  put(BB,'bb',(p,j)=>wt[j]*(hs[j].pa||1),s=>s.bb<s.pa-1);
  put(K,'k',(p,j)=>(1/wt[j])*(hs[j].pa||1),s=>s.k+s.bb<s.pa);
  hs.forEach((s,j)=>{s.ab=s.pa-s.bb;});
  put(H,'h',(p,j)=>wt[j]*Math.max(0,hs[j].ab-hs[j].k),s=>s.h<s.ab-s.k);
  put(HR,'hr',(p,j)=>Math.exp(p.pw/8)*(hs[j].h||0),s=>s.hr<s.h);
  hs.forEach(s=>{s.rbi=s.hr;});
  let rest=Math.max(0,RBI-hs.reduce((a,s)=>a+s.rbi,0));
  put(rest,'rbi',(p,j)=>wt[j]*(0.3+hs[j].h),s=>s.pa>0);
  if(fix){const f=fix.line;hs[fi]={pa:f.pa,ab:f.ab,h:f.h,hr:f.hr,rbi:f.rbi,bb:f.bb,k:f.k};}
  return {hs,tot:{H:hs.reduce((a,s)=>a+s.h,0),BB:hs.reduce((a,s)=>a+s.bb,0),K:hs.reduce((a,s)=>a+s.k,0),R}};
}
function tPitLine(starterP,N,own,opp,lost,isFinalish,fix){
  if(fix)return Object.assign({},fix);
  const f=clamp(.62+gauss()*.17+(starterP>12?.08:-.04)+(lost?-.1:.05),.2,1);
  const outs=Math.max(3,Math.round(N*3*f)),fr=outs/(N*3);
  const er=Math.max(0,Math.round(opp.R*fr*.88)),k=Math.round(opp.K*fr),h=Math.round(opp.H*fr),bb=Math.round(opp.BB*fr);
  const win=!lost&&outs>=Math.ceil(N*3*5/9),loss=lost&&er>=1;
  return {out:outs,er,so:k,h,bb,w:win?1:0,l:loss?1:0,cg:outs>=N*3?1:0};
}

/* ---------- 試合の記録(大会ごと) ---------- */
function tScoreFor(T0,a,b,w){ // 他校どうしの試合のスコア(勝者は既に決まっている)
  const N=T0.inn||(T0.stage==='es'?6:T0.stage==='jh'?7:9);
  return KRN.rng.useSync('tscore',tKey(T0)+'|'+S.yr+'|'+T0.round+'|'+a+'-'+b,()=>{
    const La=T0.teams[a].L,Lb=T0.teams[b].L,mu=N*.5;
    let sa=tPois(mu*Math.exp((La-Lb)/16)),sb=tPois(mu*Math.exp((Lb-La)/16));
    if(w===a&&sa<=sb){const t=sa;sa=sb+(sa===sb?1:0);sb=Math.min(t,sa-1);}
    if(w===b&&sb<=sa){const t=sb;sb=sa+(sa===sb?1:0);sa=Math.min(t,sb-1);}
    sa=Math.max(0,sa);sb=Math.max(0,sb);if(w===a&&sa<=sb)sa=sb+1;if(w===b&&sb<=sa)sb=sa+1;
    return [sa,sb];
  });
}
function tAddGame(T0,a,b,w,mine){
  T0.games=T0.games||[];
  const g={r:T0.round,a,b,w};
  if(mine){g.sa=mine.sa;g.sb=mine.sb;g.mine=1;g.me=mine.me;g.mp=mine.mp;}
  else{const s=tScoreFor(T0,a,b,w);g.sa=s[0];g.sb=s[1];}
  T0.games.push(g);
}
/* 自分の試合の結果を、tourneyStepへ渡す前に記録する(playTournGameから) */
function tNoteMine(T0,res,opp){

  const myS=res.mS,opS=res.oS;
  T0._mine={sa:myS,sb:opS,me:res.inGame?{pa:me.pa,ab:me.ab,h:me.h,hr:me.hr,rbi:me.rbi,bb:me.bb,k:me.so}:null,mp:res.inGame&&mp.bf>0?{out:mp.out,er:mp.er,so:mp.so,h:mp.h,bb:mp.bb,w:mp.w,l:mp.l}:null};
}

/* ---------- 全試合から個人成績を集計 ---------- */
function tAgg(T0){
  const N=T0.inn||(T0.stage==='es'?6:T0.stage==='jh'?7:9);
  const fence=(LVL[T0.stage]||{}).fence||.5;
  const agg=T0.teams.map((t,i)=>t.bye?null:({bat:tLineup(T0,i).map(()=>({g:0,pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0})),pit:{ace:{g:0,out:0,er:0,so:0,h:0,bb:0,w:0,l:0,cg:0},second:{g:0,out:0,er:0,so:0,h:0,bb:0,w:0,l:0,cg:0}},g:0,wins:0}));
  (T0.games||[]).forEach((g,gi)=>{
    const sides=[[g.a,g.b,g.sa,g.sb],[g.b,g.a,g.sb,g.sa]];
    const calc=KRN.rng.useSync('tbox',tKey(T0)+'|'+S.yr+'|'+gi,()=>{
      const bats=sides.map(([ti,oi,R,Ro],k)=>{
        const lu=tLineup(T0,ti),me=T0.teams[ti].me;
        let fix=null;
        if(me&&g.mine){const idx=lu.findIndex(p=>p.isMe);if(idx>=0)fix={idx,line:g.me||{pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0}};}
        return tBatLines(lu,N,R,T0.teams[ti].L-T0.teams[oi].L,fence,fix);
      });
      const pits=sides.map(([ti,oi,R,Ro],k)=>{
        const lu=tLineup(T0,ti),opp=bats[1-k].tot;opp.R=Ro;
        const lost=(g.w!==ti);
        const aceRests=lu.second&&T0.round<T0.labels.length-2&&chance(.18);
        const meP=T0.teams[ti].me&&g.mine&&g.mp?g.mp:null;
        const luP=lu.find(p=>p.pos==='P');
        const isAce=(T0.teams[ti].me&&luP&&luP.isMe)?!!meP:!aceRests;
        const sp=isAce?(luP||{p:8}).p:(lu.second||{p:5}).p;
        return {line:tPitLine(sp,N,bats[k].tot,opp,lost,false,meP),isAce,me:!!meP};
      });
      return {bats,pits};
    });
    sides.forEach(([ti,oi],k)=>{
      const A=agg[ti];if(!A)return;A.g++;if(g.w===ti)A.wins++;
      calc.bats[k].hs.forEach((s,pi)=>{const a=A.bat[pi];if(s.pa>0)a.g++;for(const key of ['pa','ab','h','hr','rbi','bb','k'])a[key]+=s[key];});
      const pl=calc.pits[k],P=pl.isAce?A.pit.ace:A.pit.second;P.g++;for(const key of ['out','er','so','h','bb','w','l','cg'])P[key]+=pl.line[key]||0;
    });
  });
  return agg;
}

/* ---------- 表彰 ---------- */
function tAwards(T0){
  const agg=tAgg(T0),cand=[];
  T0.teams.forEach((t,ti)=>{
    const A=agg[ti];if(!A||!A.g)return;const lu=tLineup(T0,ti),gain=1+.12*A.wins;
    lu.forEach((p,pi)=>{
      const s=A.bat[pi];
      if(s.pa>=3){const sc=(s.h+s.hr*1.8+s.rbi*.6+s.bb*.25-(s.ab-s.h)*.12)*gain;
        cand.push({ti,pi,pos:p.pos,kind:'bat',score:sc,name:p.n,sch:t.name,isMe:!!p.isMe,line:`${tAvg(s.h,s.ab)}（${s.ab}-${s.h}）${s.hr?s.hr+'本 ':''}${s.rbi}打点`});}
    });
    const pa=A.pit.ace,pp=lu.find(p=>p.pos==='P');
    if(pp&&pa.out>=6){const sc=(pa.w*4+pa.out/3*.9+pa.so*.55-pa.er*2)*gain;
      cand.push({ti,pi:-1,pos:'P',kind:'pit',score:sc,name:pp.n,sch:t.name,isMe:!!pp.isMe,line:`${pa.w}勝${pa.l}敗 防御率${tEra(pa.er,pa.out)} ${pa.so}奪三振`});}
  });
  const used=new Set();const take=(pred,k)=>{const c=cand.filter(x=>pred(x)&&!used.has(x)).sort((a,b)=>b.score-a.score).slice(0,k);c.forEach(x=>used.add(x));return c;};
  const best9=[];
  best9.push(...take(x=>x.pos==='P'&&x.kind==='pit',1).map(x=>Object.assign({lab:'投手'},x)));
  for(const pos of ['C','1B','2B','3B','SS'])best9.push(...take(x=>x.pos===pos&&x.kind==='bat',1).map(x=>Object.assign({lab:T_POSJ[pos]},x)));
  best9.push(...take(x=>['LF','CF','RF'].includes(x.pos)&&x.kind==='bat',3).map(x=>Object.assign({lab:'外野手'},x)));
  const champIdx=T0.champ?T0.teams.indexOf(T0.champ):-1;
  const mvp=cand.filter(x=>x.ti===champIdx).sort((a,b)=>b.score-a.score)[0]||cand.sort((a,b)=>b.score-a.score)[0]||null;
  return {best9,mvp};
}
function tMyLine(T0){
  const m=T0.my;if(!m||!m.in)return null;
  const b=m.bat,p=m.pit,out=[];
  if(b.pa>0)out.push(`打撃 ${tAvg(b.h,b.ab)}（${b.ab}-${b.h}）${b.hr?b.hr+'本塁打 ':''}${b.rbi}打点${b.bb?' '+b.bb+'四球':''}`);

}

/* ---------- 前年度の成績 ---------- */
const tRepOf=t=>t.rep||(t.me?repOf(S.pref,S.city):(t.pref?repOf(t.pref,t.city):''));
function tTeamRec(t,i){return {n:t.name,pf:t.pref||'',ct:t.city||'',lc:t.loc||'',rep:tRepOf(t),L:Math.round(t.L*10)/10,ab:t.aceB||5,me:!!t.me,sid:t.me?(S.team&&S.team.sid)||null:t.sid||null};}
/* P3: 学校史から作る「前年度の優勝校・準優勝校」。実記録があればそれ、なければ導出(保存しない) */
function tTeamRecSid(sid,y){const r=schGet(sid);if(!r)return null;const t=schStrAt(r,y);return {n:schLabel(r),pf:r.pref,ct:r.city,lc:'',rep:repOf(r.pref,r.city),L:Math.round(Lbase(r.stage,r.stage==='es'?5:2,t)*10)/10,ab:5,me:!!(S.team&&S.team.sid===sid),sid};}
function tPrevRec(T0Key,y){const h=(S.tHist||{})[T0Key]||[];let b=null;for(const r of h)if(r.y<y&&(!b||r.y>b.y))b=r;return b;}
/* 前年度の優勝校・準優勝校を、今年の出場校に反映する(makeTournamentから)。
   記録がなければ、初回だけ、出場校のうち強い2校を「前年の優勝校・準優勝校」として決めて保存する。 */
function tApplyPrev(spec,teams,my){
  if(!(spec.stage==='es'||spec.stage==='jh'||spec.stage==='hs'))return null;
  const key=spec.key+(spec.nat?'':'@'+(spec.pref||S.pref));
  S.tHist=S.tHist||{};
  let rec=tPrevRec(key,S.yr);
  const fam=schFamOf(Object.assign({},spec,{pref:spec.pref||S.pref,field:spec.field||spec.n,stage:spec.stage}));
  if((!rec||rec.y!==S.yr-1)&&fam){      /* 前年の記録が無い(その年は出なかった・初年度)ときは、学校史から導出 */
    const pr=schPrevResult(fam,S.yr),ch=pr&&tTeamRecSid(pr.champ,S.yr-1),ru=pr&&pr.runner?tTeamRecSid(pr.runner,S.yr-1):null;
    if(ch&&ru)rec={y:S.yr-1,ch,ru,sf:[],mvp:'',my:'',ghost:1};
  }
  const strong=teams.filter(t=>!t.star&&!t.bye).sort((a,b)=>b.L-a.L);
  if(!rec){
    if(strong.length<2)return null;
    rec={y:S.yr-1,ch:tTeamRec(strong[0]),ru:tTeamRec(strong[1]),sf:[],mvp:'',my:'',ghost:1};
    (S.tHist[key]=S.tHist[key]||[]).push(rec);
    strong[0].prev='優勝';strong[1].prev='準優勝';
  }else{
    const mean=teams.length?teams.reduce((a,t)=>a+t.L,0)/teams.length:my.L;
    [[rec.ch,'優勝',1.5],[rec.ru,'準優勝',.8]].forEach(([c,lab,bonus])=>{
      if(!c||c.me||c.n===my.name||(c.sid&&c.sid===my.sid))return;
      if(teams.some(t=>t.name===c.n)){teams.find(t=>t.name===c.n).prev=lab;return;}
      if((spec.nat||spec.reg)&&c.sid)return;      /* P7: 前年の優勝校でも、今年の県大会などで敗れていれば地区・全国には出ない(差し込まない) */
      // 差し替える校: 代表県が同じ(全国)、なければ最も弱い校(ライバル校は除く)
      let idx=-1;
      if(c.rep)idx=teams.findIndex(t=>tRepOf(t)===c.rep&&!t.star&&!t.prev);
      if(spec.nat&&c.rep&&c.rep===tRepOf(my))return;      // 全国大会: 代表県が自分と同じなら差し込まない(1県1校)
      if(idx<0){let lo=1e9;teams.forEach((t,j)=>{if(!t.star&&!t.prev&&t.L<lo){lo=t.L;idx=j;}});}
      if(idx<0)return;
      const sch=c.sid?schGet(c.sid):null;
      if(sch){teams[idx]=Object.assign(schMetaOf(sch,spec.stage,S.yr,{noise:0,dL:bonus,aceB:c.ab,loc:c.lc}),{rep:c.rep||teams[idx].rep,prev:lab});return;}
      const L=.6*c.L+.4*mean+bonus;
      teams[idx]={name:c.n,tier:5,L,uni:uniFor(c.n),pref:c.pf,city:c.ct,loc:c.lc,aceB:c.ab,rep:c.rep||teams[idx].rep,prev:lab};
    });
  }
  return rec;
}

/* ---------- 年俸 ---------- */
const SAL_MIN=440,SAL_MAX=60000;                    // 万円
const salRound=v=>v<1000?Math.round(v/10)*10:v<10000?Math.round(v/50)*50:Math.round(v/100)*100;
const fmtMan=m=>m>=10000?`${(m/10000).toFixed(m>=100000?0:m%10000===0?0:1)}億円`:`${Math.round(m).toLocaleString()}万円`;
/* 現実の水準に合わせる(P1.2調整): 1億円以上は主力級の約1割、3億円以上は球界屈指(各世代に数人)。 */
function marketSal(perf){const base=SAL_MIN+Math.pow(clamp((perf-22)/72,0,1),3.6)*20000;const star=perf>=88?1+(perf-88)*.12:1;return clamp(base*star,SAL_MIN,SAL_MAX);}
/* その年の評価点(0〜100): 立場・出場・リーグ内の順位・タイトル */
function proPerf(aw,rk,r2){
  const role=S.pro.role,b=r2.bat,p=r2.pit;
  let s={star:38,reg:30,bench:19,farm:9}[role]||17;
  const gp=b.pa>0?Math.min(1,b.pa/520):p.bf>0?Math.min(1,p.out/380):0;s+=gp*16;
  const ranks=Object.values((rk&&rk.R)||{}).filter(v=>v>0);
  const best=ranks.length?Math.min(...ranks):99;
  s+=best===1?20:best<=3?15:best<=5?10:best<=10?6:best<=20?2:0;
  s+=Math.min(6,ranks.filter(v=>v<=5).length*2);
  s+=(aw||[]).length*5;
  return clamp(Math.round(s),0,100);
}
/* 球団の提示額。上がるときは市場に近づき(k=.6)、下がるときは小さく(k=.4)、下げ幅には上限(1億まで25%、超は40%) */
function renewalOffer(cur,perf,age){
  const mkt=marketSal(perf);
  const k=mkt>=cur?.6:.4;
  let t=cur+(mkt-cur)*k;
  if(Math.abs(mkt-cur)<cur*.12)t=cur;                       // 市場価値と近いときは据え置き
  const cutMax=cur<=10000?.25:.4,raiseMax=cur<2000?2.5:cur<10000?1.5:.8;
  t=clamp(t,cur*(1-cutMax),cur*(1+raiseMax));
  if(age>=35)t=Math.min(t,cur*1.05);
  return clamp(salRound(Math.max(SAL_MIN,t)),SAL_MIN,SAL_MAX);
}
/* P8: FA・移籍の市場価値。直近1年の評価点だけで決めず、直近3年の評価(今年50%・前年30%・前々年20%)で見る。
   さらに現在の年俸(選手の格)を、急落の緩和材料として混ぜる(絶対の下限にはしない: 評価の低い年が続けば、評価も年俸も下がり続ける。年俸が市場価値を下回る選手は、市場価値のまま)。
   スターが1年出場機会を失っただけで、1億円→500万円にはならず、何年も衰えれば、数千万円→さらに低下する。 */
function marketFA(perf,cur){
  const L=(S.pro&&S.pro.log)||[],p1=L.length>=2&&L[L.length-2].perf!=null?L[L.length-2].perf:perf,p2=L.length>=3&&L[L.length-3].perf!=null?L[L.length-3].perf:p1;
  const m=marketSal(perf*.5+p1*.3+p2*.2),age=ageNow(),w=age>=37?.25:age>=33?.35:.45;
  return clamp(m+Math.max(0,(cur||0)-m)*w,SAL_MIN,SAL_MAX);
}
function perfLabel(p){return p>=85?'球界屈指の活躍':p>=70?'チームの中心として活躍':p>=55?'レギュラーとして貢献':p>=40?'控えとして貢献':p>=25?'出場機会が限られた':'ほとんど出番がなかった';}

/* ---------- 球団の事情(球団ごと・年ごとに決まる。人物DB前の簡易版) ---------- */
function teamNeed(tid,pg){return KRN.rng.useSync('tneed',tid+'|'+S.yr+'|'+pg,()=>ri(28,82));}
const posGroup=()=>S.pos==='P'?'P':S.pos==='C'?'C':['1B','2B','3B','SS'].includes(S.pos)?'IF':'OF';
function skillNow(){return S.pos==='P'?ovrPit(S.st):ovrBat(S.st);}
function roleExpectJ(skill,interest){if(skill>=70&&interest>=70)return 'star';if(skill>=55)return 'reg';if(skill>=40)return 'reg2';if(interest>=50)return 'bench';return 'dev';}
const ROLE_YRS_J={star:4,reg:3,reg2:2,bench:2,dev:1};
const ROLE_JA2={star:'主力級の待遇',reg:'レギュラー候補',reg2:'主戦力候補',bench:'控えから競争',dev:'二軍で育成'};
function faOffers(perf,excludeId){
  const sk=skillNow(),pot=(S.pos==='P'?['velo','ctl','brk']:['con','pow','spd']).reduce((a,k)=>a+S.pot[k],0)/3,age=ageNow(),pg=posGroup();
  const mk=marketFA(perf,S.pro.sal),out=[];
  PRO.forEach(t=>{
    if(t.id===excludeId)return;
    const need=teamNeed(t.id,pg);
    let interest=need*.5+sk*.35+pot*.15;if(age>=34)interest*=.75;if(S.pro.role==='farm')interest*=.85;
    if(t.id===S.fav)interest+=6;                          // 憧れの球団
    if(interest<28)return;
    const role=roleExpectJ(sk,interest),fund=clamp(.88+(t.pw/100)*.3,.88,1.15);
    const sal=salRound(clamp(mk*fund*clamp(.72+interest/100*.56,.72,1.28),SAL_MIN,SAL_MAX));
    out.push({tm:t,interest:Math.round(interest),role,sal,yrs:ROLE_YRS_J[role]||2});
  });
  return out.sort((a,b)=>b.sal-a.sal).slice(0,6);
}
const faOptLabel=o=>({t:`${o.tm.n}${o.tm.id===S.fav?'（憧れの球団）':''}`,d:`年俸${fmtMan(o.sal)}・${o.yrs}年・${ROLE_JA2[o.role]}`});

/* ---------- 所属の変更(FA・トレード・現役ドラフト・トライアウトで共通) ---------- */
function proMoveTeam(nt,how,o){
  o=o||{};const old=proOf(S.pro.id);
  S.pro.stints=(S.pro.stints||[]).concat({id:old.id,to:S.yr,how});
  S.pro.id=nt.id;S.team=makeProTeam(nt);S.pro.dev=false;S.pro.moves=(S.pro.moves||0)+1;S.pro.stintFrom=S.yr;S.pro.farmYrs=Math.min(S.pro.farmYrs||0,1);
  S.people.coach=newCoach('pro');
  S.rel.coach=clamp(S.rel.coach-12,25,100);S.rel.team=clamp(S.rel.team-18,20,100);   // 新天地では、関係を一から作る
  if(o.sal)S.pro.sal=o.sal;if(o.yrs!=null){S.pro.cy=o.yrs;}
  S.pro.role=proRoleCalc();
  S.flags.moved=true;
  const hw={fa:'FA',trade:'トレード',draft:'現役ドラフト',tryout:'トライアウト'}[how]||how;
  addMem(`${S.yr}年、${hw}で${old.n}から${nt.n}へ。`);
  addNews(`${S.name}、${nt.s}へ`,`${old.n}の${S.name}（${POSN[S.pos]}）が${hw}で${nt.n}へ移籍。${o.sal?`年俸は${fmtMan(o.sal)}${o.yrs?`（${o.yrs}年契約）`:''}。`:''}`,'スポーツ日報');
}

/* ---------- 契約更改(proAwardsから呼ぶ) ---------- */
async function proContract(perf,aw){
  const P=S.pro,age=ageNow(),old=P.sal;
  P.svc=(P.svc||0)+(P.role!=='farm'?1:0);                       // 一軍の年数(FA資格)
  P.hist=(P.hist||[]);
  const lines=[`${S.yr}年　契約更改交渉`,`今季の評価：${perf}点（${perfLabel(perf)}）`];
  // ---- 複数年契約の途中: 年俸は固定。出来高だけ ----
  if((P.cy||0)>1){
    P.cy--;const bonus=perf>=60?Math.round(old*(perf-55)/300):0;
    if(bonus>0){S.money=(S.money||0)+bonus;}
    lines.push(`複数年契約の途中（残り${P.cy}年）。年俸は${fmtMan(old)}のまま。${bonus>0?`\n好成績の出来高として${fmtMan(bonus)}が支払われた。`:''}`);
    await say('契約更改',T(lines.join('\n')),{auto:false});
    S.money=(S.money||0)+old;P.log[P.log.length-1]&&(P.log[P.log.length-1].sal=P.sal);P.log[P.log.length-1]&&(P.log[P.log.length-1].perf=perf);
    return;
  }
  const offer=renewalOffer(old,perf,age),diff=offer-old,pct=Math.round(diff/old*100);
  lines.push(`現年俸 ${fmtMan(old)}\n球団の提示 ${fmtMan(offer)}（${diff>=0?'+':''}${pct}%）`);
  const faOK=(P.svc||0)>=7&&!P.os;
  const opts=[{t:'提示額でサインする',d:`年俸${fmtMan(offer)}・1年`},
    {t:'もう少し上を求めて交渉する',d:perf>=45?'成績に自信がある':'強気に出る（失敗すると心証が悪くなる）'}];
  if(perf>=35)opts.push({t:'複数年契約を希望する',d:`${age>=31?2:3}年・年間${fmtMan(salRound(offer*(perf>=60?1:.95)))}（期間中は年俸固定）`});
  if(faOK)opts.push({t:'保留して、FA権の行使を考える',d:'他球団の評価を聞く'});
  const ev=await (async()=>{await say('契約更改',T(lines.join('\n')),{auto:false});return choose(opts);})();
  let sal=offer,yrs=1,note='',goFA=false;
  if(ev===1){
    const p=clamp(.28+(perf-45)/110+(P.moves?0:.04)+S.rel.coach/700,.1,.78);
    if(chance(p)){sal=salRound(offer*(1+ri(5,16)/100));note=`粘り強く交渉し、${fmtMan(sal)}を勝ち取った。`;}
    else{sal=chance(.3)&&perf<50?salRound(offer*.97):offer;note=sal<offer?'交渉は不調に終わり、心証を悪くして少し減額された。':'球団の姿勢は変わらなかった。提示額でサインした。';}
  }else if(ev===2&&perf>=35){
    yrs=age>=31?2:3;sal=salRound(offer*(perf>=60?1:.95));note=`${yrs}年契約を結んだ。期間中は年俸が固定される。`;
  }else if(ev===3||(ev===2&&perf<35&&faOK)){goFA=true;}
  if(goFA){const moved=await proFA(perf,offer);if(moved)return;sal=offer;note='結局、現在の球団と契約を結んだ。';}
  P.sal=clamp(sal,SAL_MIN,SAL_MAX);P.cy=yrs;
  S.money=(S.money||0)+P.sal;
  const ch=Math.round((P.sal-old)/old*100);
  await say('契約更改',T(`年俸 ${fmtMan(old)} → ${fmtMan(P.sal)}（${ch>=0?'+':''}${ch}%）${yrs>1?`\n${yrs}年契約`:''}\n${note||(ch>5?'「来年も期待している」と球団幹部が頭を下げた。':ch<-5?'数字は厳しいが、来季への闘志が湧いた。':'納得して、サインした。')}`),{auto:false});
  if(P.log[P.log.length-1]){P.log[P.log.length-1].sal=P.sal;P.log[P.log.length-1].perf=perf;}
}

/* ---------- FA ---------- */
async function proFA(perf,stayOffer){
  const P=S.pro,cur=proOf(P.id),offers=faOffers(perf,cur.id);
  A.play('drama');setView({bg:'hall',tod:'day',actors:[actorSpec('me',130,170,'stand'),actorSpec('coach',220,170)]});
  await say('FA宣言',T(`一軍${P.svc}年。FA権を行使した。\n他球団の評価は——。\n\n${offers.length?`${offers.length}球団からオファーが届いた。`:'オファーは、届かなかった。'}\n${cur.n}も、残留を求めている。`),{auto:false});
  const stay={tm:cur,sal:salRound(Math.max(stayOffer,marketFA(perf,P.sal)*.95)),role:'reg',yrs:3,stay:true};
  if(!offers.length){S.flags.faDone=true;P.svc=3;P.sal=stay.sal;P.cy=2;return false;}
  const all=offers.concat([stay]);
  const k=await choose(all.map(o=>o.stay?{t:`${cur.n}に残留する`,d:`年俸${fmtMan(o.sal)}・${o.yrs}年・慣れた環境`}:faOptLabel(o)));
  S.flags.faDone=true;P.svc=3;                       // FA権は、行使すると、再取得に4年かかる
  const o=all[k];
  if(o.stay){S.pro.sal=o.sal;S.pro.cy=o.yrs;S.money=(S.money||0)+o.sal;addMem('FA権を行使せず——いや、行使したうえで、チームに残る決断をした。');S.rel.team=clamp(S.rel.team+8,0,100);
    await say('残留',T(`${cur.n}への残留を決めた。\n年俸 ${fmtMan(o.sal)}（${o.yrs}年契約）。\n記者会見で「このチームで、最後までやる」と宣言した。ファンの拍手が、鳴りやまなかった。`),{auto:false});return true;}
  A.sfx('champ');banner('新天地へ！','#ffd23f');
  proMoveTeam(o.tm,'fa',{sal:o.sal,yrs:o.yrs});S.money=(S.money||0)+o.sal;
  const f=pfl(o.tm.id);
  await say('入団会見',T(`${o.tm.n}への入団が決まった。\n年俸 ${fmtMan(o.sal)}（${o.yrs}年契約）。\n\n本拠地は${f.st}。「${f.hl}」——${f.pr}が、${S.name}を待っている。\n新しい監督は{coach}。`),{auto:false});
  return true;
}

/* ---------- オフの移籍(トレード・現役ドラフト) ---------- */
async function proOffseasonMoves(){
  const P=S.pro,age=ageNow(),sk=skillNow(),cur=proOf(P.id);
  if(P.os||!P.year||P.year<=2)return false;
  const need=teamNeed(cur.id,posGroup());
  // トレード(旧 computeTradeChance の式)
  let tc=.015;if(need<35)tc+=.045;if(need>70)tc-=.01;if(P.role!=='reg'&&P.role!=='star')tc+=.015;if(age>=30&&sk<50)tc+=.015;
  tc=clamp(tc*(P.moves?.7:1),.003,.15);
  const dest=()=>{const c=PRO.filter(t=>t.id!==cur.id);return wpick(c,t=>(t.id===S.fav?3:1)*(.6+teamNeed(t.id,posGroup())/100));};
  if(chance(tc)){
    const nt=dest(),f=pfl(nt.id);
    A.play('drama');setView({bg:'hall',tod:'day',actors:[actorSpec('me',130,170,'stand'),actorSpec('coach',220,170)]});
    await say('トレード通告',T(`{coach}に呼ばれた。\n「${nt.n}への、トレードが決まった」\n\n${cur.n}での${(P.stints||[]).length?'':''}日々が、頭をよぎる。新天地は${f.tc}。本拠地は${f.st}だ。`),{auto:false});
    const k=await choose([{t:'前向きに受け止める',d:'環境を変えるチャンスだ'},{t:'悔しさを隠せない',d:'必要とされていなかったのか'},{t:'{partner}と話し合って決める',d:'家族と一緒に決断する'},{t:'お世話になった人に挨拶して回る',d:'感謝を伝えて旅立つ'}]);
    const eff=[{men:2},{men:1,con:-1},{men:2},{men:2}][k];
    applyFx(eff,[{},{},{partner:6},{team:4}][k]);
    proMoveTeam(nt,'trade');
    await say('新天地へ',T(`${nt.n}のユニフォームに袖を通した。\n年俸は${fmtMan(P.sal)}のまま。\n${f.hl}——${f.pr}が、${S.name}を待っている。`),{auto:false});
    return true;
  }
  // 現役ドラフト(出番に恵まれない選手)
  if((P.role==='farm'||P.role==='bench')&&P.year>=3&&age<=31&&chance(.1)){
    const nt=dest(),f=pfl(nt.id);
    A.play('drama');setView({bg:'hall',tod:'day',actors:[actorSpec('me',130,170,'stand')]});
    await say('現役ドラフト',T(`現役ドラフトで、${nt.n}から指名を受けた。\n出番に恵まれない選手に、新しい居場所を——という制度だ。\n\n${cur.n}では一軍に定着できなかった。だが、${nt.n}は${S.name}の力を必要としているという。`),{auto:false});
    const k=await choose([{t:'もう一度、ゼロから挑戦する',d:'環境を変えて飛躍を狙う'},{t:'複雑な思いで受け入れる',d:'それでもプロの世界で戦い続ける'}]);
    applyFx({men:k===0?3:1},{});proMoveTeam(nt,'draft');
    await say('新天地へ',T(`${nt.n}での新しい挑戦が始まる。\n本拠地は${f.st}。\n「${f.hl}」の中で、もう一度、一軍を目指す。`),{auto:false});
    return true;
  }
  return false;
}

/* ===== 人物DB 接続(P2) =====
   人物DB本体は KERNEL.Persons(純粋・乱数なし)。ここは「いまの S を人物DBに映す」同期処理だけを持つ。
   - pwSync() はトランザクションの中(各ビートの最後・genesis の最後)でだけ呼ぶ。描画・候補列挙・ロードでは呼ばない。
   - 乱数を一切使わない。同じ S なら何度呼んでも結果が同じ(冪等)で、変化があったときだけ履歴が増える。
   - 旧コードの人物(S.people と S.team.roster)は、そのまま動かす。旧オブジェクトに pid を書き足して、人物DBのIDと結ぶ。 */
const PW=KERNEL.Persons;
function pwInTx(){return KRN.rng.depth>0;}
function pwTick(){return KERNEL.worldTick(S);}
function pwWorld(){if(!S.world||S.world.v!==PW.WORLD_VERSION)S.world=PW.createWorld();return S.world;}
const PW_SEX={M:'M',F:'F',N:'N'};
const PW_STAGE_BASE={es:5,jh:12,hs:15,co:18,cp:22,ind:20,pro:22,am:25};
function pwLook(p){return {hair:p.hair,skin:p.skin,fid:p.fid,hs:p.hs,eye:p.eye,tans:p.tans,num:p.num};}
function pwOrgOfTeam(W,t){
  if(!S.team)return null;
  if(S.stage==='pro'&&S.pro&&S.pro.id)return pwProOrg(W,S.pro.id,t);
  if(S.stage==='co'||S.stage==='cp'||S.stage==='ind')return PW.ensureOrg(W,'ORG:'+S.stage+':'+S.team.name,{kind:{co:'college',cp:'corp',ind:'indep'}[S.stage],name:S.team.name,stage:S.stage},t).id;
  if(S.team.sid)return PW.ensureOrg(W,'SCH:'+S.team.sid,{kind:'school',name:S.team.name,stage:S.stage},t).id;
  return PW.ensureOrg(W,'T:'+S.stage+':'+S.team.name,{kind:'team',name:S.team.name,stage:S.stage},t).id;
}
function pwOrgNamed(W,ext,name,kind,t){return PW.ensureOrg(W,ext,{kind,name,stage:null},t).id;}
/* プロ球団の組織は1つ(PRO:{球団ID})。主人公・ライバル・元対戦相手が同じ組織に所属する */
function pwProOrg(W,id,t){const tm=typeof proOf==='function'?proOf(id):null;return PW.ensureOrg(W,'PRO:'+id,{kind:'pro',name:tm?tm.n:String(id),stage:'pro'},t).id;}
/* 主人公の誕生tick: 年度初め(tick0=8歳・誕生日前)から、誕生日の月を逆算する */
function pwHeroBt(){return (S.bdayM|0)-9*12;}
/* 在籍中の旧ロスターから、人物DBに映す一覧を作る(読み取りのみ) */
function pwRosterView(){
  if(!S.team||!S.team.roster)return [];
  return S.team.roster.filter(m=>m&&!m.isMe&&m.id&&m.id!=='friendM');
}
function pwSync(){
  if(!pwInTx())throw new Error('人物DBの更新はトランザクションの外では行えません');
  const W=pwWorld(),t=pwTick();
  const present=new Set();
  const seen=(id)=>present.add(id);
  const teamOrg=pwOrgOfTeam(W,t);
  /* 1) 主人公 */
  const heroSpec={role:'hero',sex:S.sex==='女'?'F':'M',name:{sur:S.sur,giv:S.giv,full:S.name},origin:{pref:S.pref,city:S.city},look:{hair:null,skin:S.skin,fid:S.fid,hs:S.hs,eye:S.eye,tans:S.tans},bt:pwHeroBt(),pos:S.pos,stage:S.stage,aff:teamOrg,tags:['hero']};
  const previousHero=PW.byExt(W,'hero'),historyFrom=previousHero?previousHero.hist.length:0;
  const hero=PW.ensurePerson(W,'hero',heroSpec,t);S.heroPid=hero.id;seen(hero.id);
  PW.setCur(W,hero.id,'stage',S.stage,t,'stage');PW.setCur(W,hero.id,'pos',S.pos,t,'pos');
  if(teamOrg)PW.setAff(W,hero.id,teamOrg,t,'team');
  if(S.stage==='end')PW.setCur(W,hero.id,'status','retired',t,'end');
  PW.noteHeroAge(W,hero.id,t,ageNow(),historyFrom);
  const heroBt=W.persons[hero.id].bt;
  /* 2) 名前つきの登場人物(親・親友・ライバル・パートナー・監督・先輩) */
  const kinds={dad:'parent',mom:'parent',friend:'friend',rival:'rival',partner:'partner',coach:'coach',senior:'senior'};
  const relScore={coach:'coach',friend:'friend',rival:'rival',partner:'partner',dad:'family',mom:'family'};
  for(const k of Object.keys(S.people||{})){
    const p=S.people[k];if(!p||!p.id||k==='coachES')continue;
    const age=p.adult?(p.age||40):(p.age!=null?p.age:20);
    let aff=null;
    if(k==='coach'||k==='senior')aff=teamOrg;
    else if(k==='friend'){
      if(['es','jh','hs'].includes(S.stage)){aff=/同じ/.test(p.where||'')?teamOrg:(p.where?pwOrgNamed(W,'W:'+p.where,p.where,'misc',t):null);if(S.stage==='hs'&&S.team)p.hsTier=S.team.tier;}
      else{fpDecide();aff=fpOrgId(W,fpNow(),t);}                                  /* P8: 高校を出た後は、親友自身の道(一度だけ決めて保存)から「いま」を導出する */
    }
    else if(k==='rival')aff=p.pro?pwProOrg(W,p.pro,t):(p.meta&&p.meta.name?pwOrgNamed(W,'CLUB:'+p.meta.name,p.meta.name,'team',t):null);
    const r=PW.ensurePerson(W,'L:'+p.id,{role:p.role||k,sex:PW_SEX[p.sex]||'N',name:{sur:p.sur,giv:p.giv,full:p.n},age,look:pwLook(p),pos:p.pos,stage:p.stage||null,aff,tags:['cast',kinds[k]||k]},t);
    p.pid=r.id;if(k==='coach'&&S.people.coachES&&S.people.coachES.id===p.id)S.people.coachES.pid=r.id;
    seen(r.id);
    PW.setCur(W,r.id,'aff',aff,t,k+':move');
    if((k==='friend'||k==='rival')&&W.persons[r.id])p.age=Math.max(0,Math.floor((t-W.persons[r.id].bt)/12));      /* P8: 年齢は人物DBの誕生tickと世界の時刻から導出(8歳のまま止まらない) */
    if(k==='friend'&&!['es','jh','hs'].includes(S.stage))fpApply(W,r.id,t);
    if(p.pro)PW.setCur(W,r.id,'stage','pro',t,'pro');
    if(kinds[k]&&relScore[k]&&S.rel&&S.rel[relScore[k]]!=null)PW.noteRel(W,hero.id,r.id,{k:kinds[k],s:Math.round(S.rel[relScore[k]])},t,'score');
  }
  /* 3) 自チームの仲間(旧ロスター)。親友は 2) で登録済み。進学の対象(小・中・高)は素質・進学の予定年を持ち、'pipe' として P5 の進学の仕組みに乗る */
  const pipeOn=['es','jh','hs'].includes(S.stage)&&S.team&&S.team.sid;
  const sch0=pipeOn?schGet(S.team.sid):null,home0=sch0?{pref:sch0.pref,city:sch0.city}:{pref:S.pref,city:S.city};
  for(const m of pwRosterView()){
    let r;
    if(m.pid&&W.persons[m.pid])r={id:m.pid,created:false};
    else{
      const rel=(m.g!=null?m.g:1)-(S.grade||1);
      const school=['es','jh','hs','co'].includes(S.stage);
      const bt=school?PW.fyStart(heroBt)-12*rel+(parseInt(KERNEL.hash32('L:'+m.id).slice(0,4),16)%12):PW.fyStart(heroBt)-12*((parseInt(KERNEL.hash32('L:'+m.id).slice(4,8),16)%16)-5);
      const spec={role:'teammate',sex:'M',name:{sur:m.sur,giv:'',full:m.n},bt,look:pwLook(m),pos:m.pos,stage:S.stage,aff:teamOrg,tags:pipeOn?['team','pipe']:['team'],approx:!school};
      if(pipeOn)spec.attr=pipeAttr(S.stage,pipeNextYear(S.stage,pipeSchoolYear(),m.g),pipeTal(m,S.team.roster,S.team.tier),m.isP,home0,S.team.sid);
      r=PW.ensurePerson(W,'L:'+m.id,spec,t);
    }
    m.pid=r.id;seen(r.id);
    if(!(W.persons[r.id].tags.includes('pipe')&&W.persons[r.id].a&&W.persons[r.id].a.ent!=null&&r.created===false))PW.setCur(W,r.id,'aff',teamOrg,t,'team');   /* 進学の人物の所属は pipeAdvance が決める(引退・移籍後に名簿に残っていても所属を戻さない) */
  }
  /* 4) いなくなった人(監督の交代・卒業・退部)は、所属を閉じる。人物は消さない。
        進学の人物('pipe')の卒業・進学は pipeAdvance が決める。ここでは、いまのチームの名簿から期限前に外れた人だけを退部として閉じる */
  for(const id of Object.keys(W.persons)){
    if(present.has(id))continue;const p=W.persons[id];
    if(!(p.tags.includes('cast')||p.tags.includes('team')))continue;
    if(p.tags.includes('pipe')){
      if(['es','jh','hs'].includes(p.cur.stage)&&p.a&&p.a.next!=null&&p.a.next>pipeSchoolYear()&&p.cur.aff&&p.cur.aff===teamOrg)pipeQuit(W,p,t,'退部','team');
      continue;
    }
    if(p.cur.aff)PW.setAff(W,id,null,t,'left');
  }
  /* 5) 友人がロスターにいる間は、親友の所属も自チームのまま(2で処理済み) */
  /* 6) 他校の選手(P4): 卒業・進路・プロ入りのニュース・同じ球団の元対戦相手(時間が来たときだけ動く・冪等) */
  if(typeof opAdvance==='function')opAdvance();
  startSync(W,t);
  return W;
}

/* ===== 学校DB(P3) =====
   学校は「大会の対戦相手」ではなく、人生を通して存在する永続組織(schoolId=sid 固定)。
   - 学校そのもの(名前・所在地・歴史的な格 base・創立)は、lifeSeed と sid から決まる「マスター」。保存せず、必要なときに導出する。
     導出は KERNEL.createStream の派生ストリームだけを使う → 一覧・参照・年度の実力・履歴の表示は、状態も本編の乱数も動かさない。
   - 「歴史的な格」と「その年の実力」は分離: 年度の実力 = base + 在籍世代の質(KERNEL.Dynasty)。
   - 大会の結果は S.world.th に、COMMIT内でだけ記録する(schRecord)。記録のない年は KERNEL.TourneyHistory が導出する。
   - ウィザードで選んだクラブなど、マスターにない学校は schAdopt で S.world.adopt に登録(トランザクション内のみ)。 */
const SCH_CODE={es:'E',jh:'J',hs:'H'};
const SCH_OF_CODE={E:'es',J:'jh',H:'hs'};
const schOn=stage=>stage==='es'||stage==='jh'||stage==='hs';
const _sch={seed:null,pools:new Map(),byId:new Map()};
function schSeed(){const s=KRN.lifeSeed>>>0;if(_sch.seed!==s){_sch.seed=s;_sch.pools=new Map();_sch.byId=new Map();}return s;}
const schPad=(n,w)=>String(n).padStart(w,'0');
function schCities(pref){const c=PREFS[pref]?PREFS[pref].c:[];return Array.isArray(c)?c:String(c).split(',').filter(Boolean);}
function schH(str){return parseInt(KERNEL.hash32(str).slice(0,6),16);}
function schCount(stage,city){
  const h=schH(stage+'|'+city),big=/[市区]$/.test(city),town=/町$/.test(city);
  if(stage==='es')return big?4+h%4:town?2+h%2:1+h%2;
  if(stage==='jh')return big?3+h%3:town?1+h%2:1;
  return big?3+h%4:town?1+h%2:1;
}
function schBaseFor(stage,pub,club,s){
  const tiers=[1,2,2,3,3,3,4,5];let b=tiers[Math.floor(s.next()*tiers.length)]+(s.next()-.5)*.9;
  if(stage==='hs')b+=pub?-.25:.35;if(stage==='jh'&&club)b+=.5;
  return Math.max(.9,Math.min(5.3,b));
}
function schMakeName(stage,city,s,pub,club){
  const pk=a=>a[Math.floor(s.next()*a.length)];const tc=trimCity(city);
  if(stage==='es')return s.next()<.45?tc+pk(DIST)+pk(SUF_ES):tc+pk(SUF_ES);
  if(stage==='jh')return club?tc+pk(CLUB_JH):tc+'市立'+pk(MID_JH)+'中学校';
  if(pub){const r=s.next();return r<.5?tc+pk(HS_PUB)+'高校':r<.8?tc+'高校':tc+pk(['工業','商業','農業','総合'])+'高校';}
  const sf=pk(HS_SUF);return pk(HS_K1)+pk(HS_K2)+(sf==='高校'?'高校':sf);
}
/* 都道府県×段階の学校一覧(sid順)。名前は県内で一意。 */
function schPrefPool(stage,pref){
  const seed=schSeed(),pk=stage+'|'+pref;let pool=_sch.pools.get(pk);if(pool)return pool;
  pool=[];const names=new Set(),pi=PREF_LIST.indexOf(pref),cities=schCities(pref);
  cities.forEach((city,ci)=>{
    const n=schCount(stage,city);
    for(let k=0;k<n;k++){
      const sid=`${SCH_CODE[stage]}${schPad(pi,2)}.${schPad(ci,3)}.${schPad(k,2)}`;
      const s=KERNEL.createStream(seed,'school',sid);
      const club=stage==='jh'&&s.next()<.22,pub=stage==='hs'?s.next()<.55:stage!=='es';
      let name=schMakeName(stage,city,s,pub,club),g=0;
      while(names.has(name)&&g++<12)name=schMakeName(stage,city,s,pub,club);
      if(names.has(name))name+=schPad(k+2,1)+(stage==='hs'?'':'号');
      names.add(name);
      const base=schBaseFor(stage,pub,club,s),founded=2030-Math.round(8+s.next()*s.next()*110);
      const rec={sid,stage,pref,city,name,pub,club,base,fac:base,founded,uni:uniFor(name)};
      pool.push(rec);_sch.byId.set(sid,rec);
    }
  });
  _sch.pools.set(pk,pool);return pool;
}
function schCityPool(stage,pref,city){return schPrefPool(stage,pref).filter(r=>r.city===city);}
function schAdopted(sid){return S&&S.world&&S.world.adopt?S.world.adopt[sid]||null:null;}
function schGet(sid){
  if(!sid)return null;
  const m=/^([EJH])(\d\d)\.(\d{3})\.(\d\d)$/.exec(sid);
  if(m){const stage=SCH_OF_CODE[m[1]],pref=PREF_LIST[+m[2]];if(pref){schPrefPool(stage,pref);return _sch.byId.get(sid)||null;}return null;}
  const a=schAdopted(sid);return a?Object.assign({sid,fac:a.base,uni:uniFor(a.name),adopted:true},a):null;
}
function schByName(stage,pref,name){return schPrefPool(stage,pref).find(r=>r.name===name)||null;}
const schStrAt=(sch,yr)=>KERNEL.Dynasty.strengthAt(schSeed(),sch,yr);
const schTierR=t=>Math.max(1,Math.min(5,Math.round(t)));
/* 年度 yr の強さに近い学校を、城内(都市)から選ぶ。本編の乱数(rnd)を使う=トランザクション内でだけ呼ぶ。 */
function schPick(stage,pref,city,want,names,yr,opt){
  opt=opt||{};let c=schCityPool(stage,pref,city).filter(r=>!(names&&names.has(r.name)));
  if(opt.club!==undefined)c=c.filter(r=>!!r.club===!!opt.club);
  if(opt.pub!==undefined)c=c.filter(r=>!!r.pub===!!opt.pub);
  if(!c.length)c=schPrefPool(stage,pref).filter(r=>!(names&&names.has(r.name))&&(opt.club===undefined||!!r.club===!!opt.club));
  if(!c.length)return null;
  const sc=c.map(r=>({r,d:Math.abs(schStrAt(r,yr)-want)})).sort((a,b)=>a.d-b.d||(a.r.sid<b.r.sid?-1:1));
  const near=sc.filter(x=>x.d<=.7);const arr=near.length?near:sc.slice(0,3);
  return arr[Math.floor(rnd()*arr.length)].r;
}
/* 学校 → 対戦用のメタ(makeMeta と同じ形)。強さは「その年の実力」。 */
function schMetaOf(r,stage,yr,o){
  o=o||{};const t=schStrAt(r,yr);
  const L=Lbase(stage,o.g||(stage==='es'?5:2),t)+(o.noise!=null?o.noise:gauss()*2.2)+(o.dL||0);
  return {name:r.name,tier:schTierR(t),L,uni:r.uni||uniFor(r.name),pref:r.pref,city:r.city,loc:o.loc||'',aceB:o.aceB!=null?o.aceB:ri(2,8),sid:r.sid};
}
/* マスターにない学校を登録(トランザクション内)。同じ名前・段階・県なら同じsid。 */
function schAdopt(stage,name,pref,city,tier){
  const sid='X'+SCH_CODE[stage]+'.'+KERNEL.hash32(stage+'|'+pref+'|'+name).slice(0,8);
  const W=pwWorld();W.adopt=W.adopt||{};
  if(!W.adopt[sid])W.adopt[sid]={stage,name,pref,city:city||'',base:Math.max(.9,Math.min(5.3,+tier||3)),founded:S.yr-10};
  return sid;
}
function schResolve(stage,name,pref,city,tier){
  if(!schOn(stage))return null;
  const m=schByName(stage,pref||S.pref,name);if(m)return m.sid;
  return schAdopt(stage,name,pref||S.pref,city||S.city,tier);
}
/* ---------- 大会史(環境の用意) ---------- */
/* fam は自己記述的: 大会キー@県|段階|都市(* は県全体)|出場校数|枠数 */
const schFamOf=T0=>{
  if(!T0||!tIsAm(T0)||T0.fixedField)return null;
  if(T0.nat||T0.reg){      /* P7: 地区・全国大会も学校史の対象(出場校は全国の学校世界から選ばれる) */
    if(!W_KEYS.has(T0.key))return null;
    return `${T0.key}@${T0.nat?'*':S.region}|${T0.stage}|*|${T0.field||T0.n}|${T0.n}`;
  }
  const city=(T0.scope==='city')?S.city:'*';
  return `${T0.key}@${T0.pref||S.pref}|${T0.stage}|${city}|${T0.field||T0.n}|${T0.n}`;
};
function schFamInfo(fam){
  const p=fam.split('|');if(p.length!==5)return null;
  if(W_KEYS.has(p[0].split('@')[0]))return {pool:[],field:+p[3],n:+p[4]};     /* 地区・全国: 出場校は下位の大会から選ぶ(wDerive) */
  const pref=p[0].split('@')[1],stage=p[1],city=p[2],field=+p[3],n=+p[4];
  const pool=city==='*'?schPrefPool(stage,pref):schCityPool(stage,pref,city);
  return pool.length>=2?{pool,field:Math.min(field,pool.length),n}:null;
}
const schEnv=()=>({tune:W_TUNE,lifeSeed:schSeed(),famInfo:schFamInfo,strength:(sch,y)=>schStrW(sch,y),strengthOf:(sid,y)=>wStrOf(sid,y),derive:(fam,y)=>wDerive(fam,y),history:fam=>{const p=wFamParse(fam);return p&&W_KEYS.has(p.k)?12:40;}});
function schTH(){const W=S.world;if(!W)return null;return W.th||(W.th=KERNEL.TourneyHistory.createTH());}
const schTHRead=()=>(S.world&&S.world.th)||KERNEL.TourneyHistory.createTH();    // 読み取り専用(作らない)
/* 前年度の優勝校・準優勝校(実記録、なければ導出)。読み取りのみ。 */
function schPrevResult(fam,yr){
  if(!fam)return null;const r=KERNEL.TourneyHistory.resultOf(schEnv(),schTHRead(),fam,yr-1);
  if(!r||!r.champ)return null;return r;
}
/* 大会の終わり(COMMIT内)に実記録を作る。同じ大会・同じ年は二重に入らない。返り値: { rec, ach } */
function schRecord(T0){
  const fam=schFamOf(T0);if(!fam||!S.world)return null;
  const TH=schTH(),k=KERNEL.TourneyHistory;
  const ci=T0.teams.map((t,i)=>i),depth=new Map();
  (T0.br||[]).forEach((surv,rd)=>{surv.forEach(i=>depth.set(i,rd));});
  const idxOf=t=>T0.teams.indexOf(t);
  const f=[],d=[];
  T0.teams.forEach((t,i)=>{if(t.bye)return;const sid=t.me?S.team.sid:t.sid;if(!sid)return;f.push(sid);d.push(depth.has(i)?depth.get(i):0);});
  const sidAt=i=>{const t=T0.teams[i];return !t||t.bye?null:(t.me?S.team.sid:t.sid)||null;};
  const L=T0.labels.length;
  const champ=T0.champ?sidAt(idxOf(T0.champ)):null;
  const last=(T0.games||[])[(T0.games||[]).length-1];
  const runner=last&&champ?(()=>{const a=sidAt(last.a),b=sidAt(last.b);return a===champ?b:a;})():null;
  const g=[];(T0.games||[]).forEach(x=>{
    const a=sidAt(x.a),b=sidAt(x.b),w=sidAt(x.w);if(!a||!b||!w)return;
    if(x.r>=L-3||a===S.team.sid||b===S.team.sid)g.push([x.r,a,b,w,x.sa,x.sb]);
  });
  const rec={y:S.yr,fam,n:T0.n,rounds:L,champ,runner,f,d,g,name:T0.name,key:T0.key,stage:T0.stage};
  const env=schEnv();
  const ach=k.achievements(env,TH,Object.assign({},rec),S.team.sid);   // 記録する前の歴史に対する意味
  if(!k.recordTournament(TH,rec))return null;
  return {rec,ach};
}
/* 大会導入に出す「学校史」の1行(読み取りのみ) */
function schIntroLine(T0){
  const fam=schFamOf(T0);if(!fam||!S.team||!S.team.sid)return '';
  const st=KERNEL.TourneyHistory.standing(schEnv(),schTHRead(),fam,S.team.sid,S.yr);if(!st)return '';
  const nm=S.team.name;let t;
  if(st.first)t=`${nm}は、この大会が初出場だ。`;
  else if(st.gap>=3)t=`${nm}は${st.gap}年ぶり${st.apps+1}回目の出場だ。`;
  else if(st.streak>=2)t=`${nm}は${st.streak+1}年連続${st.apps+1}回目の出場だ。`;
  else t=`${nm}は${st.apps+1}回目の出場だ。`;
  if(st.titles>0)t+=`（優勝${st.titles}回）`;
  else if(st.best&&st.best.depth>=st.best.rounds-1&&st.apps>0)t+=`（最高成績は準優勝以上）`;
  return t;
}
/* 学校の「いま」: 在籍世代と評価(読み取りのみ) */
function schNow(sid,yr){
  const r=schGet(sid);if(!r)return null;
  const gens=KERNEL.Dynasty.generationsAt(schSeed(),sid,r.stage,yr),t=schStrAt(r,yr);
  return {sch:r,strength:t,tier:schTierR(t),gens,golden:gens.some(g=>g.label==='黄金世代'),slump:gens.some(g=>g.label==='谷間の世代'&&g.grade>=2)};
}
/* 記録した大会を、その時のチームメイト(人物DB)の記憶に結ぶ。pwSync はトランザクション内で冪等。 */
function schLinkPersons(rec){
  if(!S.team||!S.team.sid||!rec)return 0;
  pwSync();const W=S.world,P=KERNEL.Persons,t=KERNEL.worldTick(S);
  const org=P.orgByExt(W,'SCH:'+S.team.sid);if(!org)return 0;
  const depth=rec.d[rec.f.indexOf(S.team.sid)];let n=0;
  for(const p of P.membersAt(W,org.id,t))if(P.addMemory(W,p.id,{t,k:'tourn',ref:KERNEL.TourneyHistory.recKey(rec.fam,rec.y),v:depth}))n++;
  return n;
}

/* ---------- 進学先・ライバル校を、学校DBから選ぶ(トランザクション内) ---------- */
function schRivalMeta(stage,pref,city,want,names,opt){
  const sc=schPick(stage,pref,city,want,names,S.yr,opt);if(!sc)return null;
  const t=Math.max(schStrAt(sc,S.yr),want-.6);
  return {name:sc.name,tier:schTierR(t),sid:sc.sid,pref,L:Lbase(stage,stage==='es'?4:2,t),uni:sc.uni||uniFor(sc.name)};
}
function schOfferName(stage,pref,city,want,used,opt,fallbackName){
  const sc=schPick(stage,pref,city,want,used,S.yr,opt);

  const n=fallbackName();used.add(n);return {n,tier:want,sid:null};
}

/* ===== 他校の選手(P4) =====
   相手校の選手は、学校×入学年度×スロットで固定された人物(KERNEL.Players、純粋)。
   - 先発の顔ぶれ(名前・ポジション・素質)は導出するだけ → 大会の表彰・成績の合成(tLineup)は、毎回同じ選手を使う。状態も本編の乱数も動かさない。
   - 主人公が対戦した相手校の「注目選手」(エースと最も打てる打者)だけを、COMMIT内で人物DBに登録する(opRegister)。登録は ext で冪等。
   - 卒業の翌4月に進路が決まり(pwSync の中で、時間が来たときだけ)、プロ入りは新聞に載る。主人公が同じ球団に入れば、元対戦相手の同僚になる。
   - 小・中・高が対象。大学・社会人・独立・プロの相手選手は P5 以降。 */
const OPK=KERNEL.Players;
const _opn=new Map();
function opName(pl){
  const k=pl.sid+'|'+pl.entry+'|'+pl.slot;let n=_opn.get(k);if(n)return n;
  const seq=[pl.na,pl.nb];let i=0;n=pickName(()=>seq[i++%2],'男',null);
  if(_opn.size>60000)_opn.clear();_opn.set(k,n);return n;
}
const opPosJ=pos=>({P:'投手',C:'捕手','1B':'一塁手','2B':'二塁手','3B':'三塁手',SS:'遊撃手',LF:'外野手',CF:'外野手',RF:'外野手'})[pos]||pos;
/* 年度の先発(tLineup と同じ形)。読み取りのみ。
   学校×入学年度×スロットの導出選手に加えて、人物DBにいる選手(進学してきた元チームメイト・元対戦相手)が、そのポジションで上回れば先発に入る(P5)。 */
const opScore=(e,g)=>(e.isP?e.p*1.6:e.b+e.pw*.4)+.8*(g-1);
function opPersonEntries(sid,stage,yr){
  const W=S&&S.world;if(!W)return [];
  const org=KERNEL.Persons.orgByExt(W,'SCH:'+sid);if(!org)return [];
  const out=[];
  for(const id of Object.keys(W.persons)){
    const p=W.persons[id],a=p.a;
    if(!a||a.ent==null||p.cur.aff!==org.id||p.cur.stage!==stage||!p.cur.pos)continue;
    const g=yr-a.ent+1;if(g<1||g>(PIPE_SPAN[stage]||3))continue;
    const isP=p.cur.pos==='P';
    out.push({n:p.name.full,pos:p.cur.pos,b:(a.tal-.45)*26-(isP?2.5:0),pw:(a.tal-.45)*14,p:isP?6+a.tal*14:0,isP,ext:p.ext,pid:p.id,grade:g});
  }

}
function opLineup(sid,stage,yr){
  const lu=OPK.lineupFor(schSeed(),sid,stage,yr);
  const out=lu.starters.map(pl=>({n:opName(pl).full,pos:pl.pos,b:pl.b,pw:pl.pw,p:pl.isP?pl.p:0,isP:pl.isP,ext:OPK.extOf(pl),grade:pl.grade}));
  for(const e of opPersonEntries(sid,stage,yr)){
    const i=out.findIndex(x=>x.pos===e.pos);
    if(i>=0&&!out[i].pid&&opScore(e,e.grade)>=opScore(out[i],out[i].grade))out[i]=e;

  const s2=lu.second;out.second={n:opName(s2).full,p:s2.p,ext:OPK.extOf(s2),grade:s2.grade};

}
const opTeamStage=sid=>{const m=/^X?([EJH])/.exec(sid||'');return m?SCH_OF_CODE[m[1]]:null;};
/* 登録する選手の誕生tick(入学時の年齢から決定的に)。スロットとsidで誕生月を散らす。 */
function opBt(pl,stage){
  const a0=stage==='es'?8:stage==='jh'?12:15;
  const mon=parseInt(KERNEL.hash32('OPBT|'+OPK.extOf(pl)).slice(0,4),16)%12;
  return (pl.entry-2030)*12-a0*12-mon;
}
/* 大会の終わり(COMMIT内): 主人公が戦った相手校の注目選手(エースと最も打てる打者)と、元チームメイト・元対戦相手を人物DBに結ぶ。
   導出の選手は ext で冪等に登録。人物DBにいる選手は、対戦の記憶と関係を足すだけ。同じ顔ぶれとの再会は思い出に残る。 */
function opRegister(T0,rec){
  if(!rec||!S.world||!S.team||!S.team.sid)return 0;
  pwSync();const W=S.world,P=KERNEL.Persons,t=KERNEL.worldTick(S);
  const hero=P.byExt(W,'hero');if(!hero)return 0;
  const mine=(T0.games||[]).filter(g=>g.mine);let made=0;
  for(const g of mine){
    const ai=T0.teams[g.a],bi=T0.teams[g.b];const opp=(ai&&ai.me)?bi:ai;const iWon=(g.w===(ai&&ai.me?g.a:g.b));
    if(!opp||opp.bye||!opp.sid)continue;const stage=opTeamStage(opp.sid);if(!stage)continue;
    const lu=opLineup(opp.sid,stage,S.yr);
    const org=P.orgByExt(W,'SCH:'+opp.sid)||{id:P.ensureOrg(W,'SCH:'+opp.sid,{kind:'school',name:opp.name,stage},t).id};
    let bat=null;for(const e of lu)if(!e.isP&&(!bat||e.b+e.pw*.4>bat.b+bat.pw*.4))bat=e;
    const feat=[lu[0],bat].filter(Boolean);
    for(const e of lu)if(e.pid&&!feat.includes(e)&&P.sharedOrgs(W,hero.id,e.pid).length)feat.push(e);
    for(const e of feat){
      let pid=e.pid;
      if(!pid){
        const x=OPK.parseExt(e.ext),pl=OPK.derivePlayer(schSeed(),x.sid,x.entry,x.slot),nm=opName(pl);
        const r=P.ensurePerson(W,e.ext,{role:'opponent',sex:'M',name:{sur:nm.sur,giv:nm.giv,full:nm.full},bt:opBt(pl,stage),pos:pl.pos,stage,aff:org.id,tags:['opp',stage,'pipe'],attr:pipeAttr(stage,pl.entry+PIPE_SPAN[stage],pl.tal,pl.isP,{pref:opp.pref||S.pref,city:opp.city||S.city},opp.sid)},t);
        pid=r.id;if(r.created)made++;
      }
      const ref=KERNEL.TourneyHistory.recKey(rec.fam,rec.y);
      P.addMemory(W,pid,{t,k:'faced',ref:ref+'#'+g.r,v:iWon?'W':'L'});
      const mate=P.sharedOrgs(W,hero.id,pid).length>0;
      P.noteRel(W,hero.id,pid,mate?{k:'former_teammate',s:iWon?40:50}:{k:'opponent',s:iWon?30:45},t,iWon?'勝った':'負けた',5);
      if(mate&&P.addMemory(W,pid,{t,k:'reunion',ref,v:1}))addMem(`元チームメイトの${W.persons[pid].name.full}（${opp.name}）と、${T0.name}で戦った。${iWon?'今回は、こちらが勝った。':'今回は、相手が上だった。'}`);
    }
  }

}
/* pwSync の最後に呼ばれる。期限が来た進学・進路を確定し、同じ球団に入った元対戦相手・元チームメイトを同僚として結ぶ。トランザクション内・冪等。 */
function opAdvance(){
  const W=S.world;if(!W)return;const P=KERNEL.Persons,t=KERNEL.worldTick(S);
  pipeAdvance(pipeNowYear());
  worldYearEnd();
  const hero=P.byExt(W,'hero');if(!hero)return;
  /* 主人公と同じ組織(球団・大学・社会人・独立)に所属する人物を、同僚として結ぶ(関係も思い出も一度だけ)。元チームメイトか、元対戦相手かで関係の種類が変わる */
  const proOn=S.stage==='pro'&&S.pro&&S.pro.id;
  const org=proOn?P.orgByExt(W,'PRO:'+S.pro.id):(['co','cp','ind'].includes(S.stage)&&S.team?P.orgByExt(W,'ORG:'+S.stage+':'+S.team.name):null);
  if(org)for(const id of Object.keys(W.persons)){
    const p=W.persons[id];if(!p.tags.includes('pipe')||p.cur.aff!==org.id)continue;
    const was=P.relBetween(W,hero.id,id);if(was&&(was.k==='former_opponent'||was.k==='former_teammate'||was.k==='colleague'))continue;
    const mate=P.sharedOrgs(W,hero.id,id).filter(x=>x.org!==org.id).length>0,faced=p.mem.some(m=>m.k==='faced');
    if(!mate&&!faced)continue;
    P.noteRel(W,hero.id,id,{k:mate?'former_teammate':'former_opponent',s:40},t,'同じ'+(proOn?'球団':'チーム'),1);
    const sc=[...p.hist].reverse().find(h=>h.k==='aff'&&h.to&&W.orgs[h.to]&&W.orgs[h.to].kind==='school'),sn=sc?W.orgs[sc.to].name:'';
    addMem(`${p.name.full}${sn?`（${sn}）`:''}が同じ${org.name}に入ってきた。${mate?'同じチームで戦った仲間だ。':'高校時代に対戦した相手だ。'}`);
  }
  /* プロで再会: 主人公がプロにいるとき、別の球団の元チームメイト・元ライバルとの初対戦を、思い出とニュースに残す(最大1人/回・素質の高い人物のみ) */
  if(proOn&&org&&S.flags.proMeetYr!==S.yr){
    /* P8: 今年プロで初めて顔を合わせた人を、1人だけ物語にする(残りは、人物データのまま残り、後の年に出る)。元チームメイトを優先し、次に素質の高い人 */
    const ERA={hs:'高校時代',jh:'中学時代',es:'少年野球のころ',co:'大学時代',cp:'社会人時代',ind:'独立リーグ時代'};
    let best=null;
    for(const id of Object.keys(W.persons)){
      const p=W.persons[id];
      if(!p.tags.includes('pipe')||p.cur.stage!=='pro'||!p.cur.aff||p.cur.aff===org.id||!(p.a&&p.a.tal>=.7))continue;
      const rel=P.relBetween(W,hero.id,id);if(!rel||!(rel.k==='former_teammate'||rel.k==='opponent'||rel.k==='former_opponent'))continue;
      if(p.mem.some(m=>m.k==='promeet'))continue;
      const sc=(rel.k==='former_teammate'?10:0)+p.a.tal;if(!best||sc>best.sc)best={id,p,rel,sc};
    }
    if(best&&P.addMemory(W,best.id,{t,k:'promeet',ref:'first',v:1})){
      const p=best.p,tm=W.orgs[p.cur.aff].name,mate=best.rel.k==='former_teammate';
      const fm=p.mem.find(m=>m.k==='faced'),key=fm?String(fm.ref||'').split('#')[0].split('@')[0].slice(0,2):'',era=ERA[key]||'かつて';
      S.flags.proMeetYr=S.yr;
      addMem(mate?`元チームメイトの${p.name.full}（${tm}）と、プロの舞台で対戦した。`:`${era}に対戦した${p.name.full}（${tm}）と、プロの舞台で顔を合わせた。`);
      addNews(`${p.name.full}（${tm}）と再会`,`${S.name}は、${mate?'かつて同じチームで戦った':era+'に対戦した'}${p.name.full}（${tm}）と、プロの舞台で相まみえた。`);
    }
  }
}

/* ===== 進学の人物履歴(P5) =====
   小学校→中学校→高校→(大学・社会人・独立・プロ)を、同じ personId の1本の履歴にする。固定のfeederは持たない。
   進学先は KERNEL.Pathways.decide が、居住地域→通学圏→地元候補校→本人の素質→スカウト/推薦/特待/転居→本人の決定、の順に決める。
   - 決定は (lifeSeed・人物の外部キー・進学年度・学校の強さ) だけで決まる純粋な導出。コミット(pipeAdvance)は人物DBへ「一度だけ」書き、理由を履歴に残す。
   - 描画・候補列挙・ロードでは何も書かない。pipeAdvance / pipeInject はトランザクション内(pwSync・チーム作成)からだけ呼ぶ。
   - 旧ロスターの選手(主人公の仲間)も、対戦相手の注目選手(P4)も、同じ仕組みで進学する。同じ学校に進んだ人は、次のチームの名簿に同じ personId で入る。 */
const PIPE_SPAN={es:4,jh:3,hs:3};
const PIPE_NEXT={es:'jh',jh:'hs'};
function pipeSchoolYear(){const T=S.team;if(!T)return S.yr;return S.stage==='es'?T.since+(S.grade-3):T.since+S.grade;}
const pipeNextYear=(stage,ys,g)=>stage==='es'?ys+(6-g)+1:ys+(3-g)+1;
const pipeNowYear=()=>2030+Math.floor(KERNEL.worldTick(S)/12);
function pipeZone(pref,city){
  const cs=schCities(pref);let reg=null;const R=typeof SUBREG!=='undefined'?SUBREG[pref]:null;
  if(R)for(const k in R.r)if(R.r[k].includes(city))reg=R.r[k];
  const list=reg||cs,i=list.indexOf(city);if(i<0)return [];
  return list.filter((c,j)=>j!==i&&Math.abs(j-i)<=2&&cs.includes(c));
}
let _pipeEnv=null;
function pipeEnv(){
  if(_pipeEnv&&_pipeEnv.seed===schSeed())return _pipeEnv.env;
  const env={schools:(stage,pref,city)=>city==null?schPrefPool(stage,pref):schCityPool(stage,pref,city),strength:(sch,y)=>schStrAt(sch,y),zone:pipeZone,cities:p=>schCities(p),prefs:()=>PREF_LIST};
  _pipeEnv={seed:schSeed(),env};return env;
}
const pipeSchOrg=(W,sid,t)=>{const r=schGet(sid);return KERNEL.Persons.ensureOrg(W,'SCH:'+sid,{kind:'school',name:r?r.name:sid,stage:r?r.stage:null},t).id;};
/* 旧ロスターの選手の素質(0〜1): チーム内の順位と、チームの格 */
function pipeTal(m,roster,tier){
  const ov=x=>x.isP?ovrPit(x.st):ovrBat(x.st),me=ov(m);
  const below=roster.filter(x=>x&&x.st&&ov(x)<me).length,pct=roster.length>1?below/(roster.length-1):.5;
  return Math.max(0,Math.min(1,.18+.72*pct+((tier||3)-3)*.035));
}
function pipeAttr(stage,next,tal,isP,home,sid){return {tal,isP:!!isP,ent:next-PIPE_SPAN[stage],next,home,sid:sid||null,bb:'active'};}
/* ---------- 進学のコミット(トランザクション内・冪等) ---------- */
function pipeQuit(W,p,t,reason,from){
  const P=KERNEL.Persons,curOrg=p.cur.aff?W.orgs[p.cur.aff]:null;
  if(p.cur.aff)P.setAff(W,p.id,null,t,'退部:'+reason);
  P.setCur(W,p.id,'stage','retired',t,'quit');P.addEvent(W,p.id,{t,k:'quit',from,why:reason});
  P.setAttr(W,p.id,{next:null,plan:null,bb:'retired',ret:{y:2030+Math.floor(t/12),org:curOrg?curOrg.id:null,why:reason}});P.addTag(W,p.id,'quit');
}
function pipeStep(W,p,env){
  const P=KERNEL.Persons,PW2=KERNEL.Pathways,a=p.a,stage=p.cur.stage,tt=(a.next-2030)*12;
  /* 履歴の時刻: 期限(4月)が来ていればその時刻。名簿づくりのために少し早く確定する場合は、いまの時刻(未来の時刻を書かない) */
  const last=p.hist[p.hist.length-1],t=Math.max(Math.min(tt,KERNEL.worldTick(S)),last?last.t:0);
  if(stage==='es'||stage==='jh'){
    const to=PIPE_NEXT[stage];
    const d=PW2.decide(schSeed(),env,{key:p.ext,tal:a.tal,isP:!!a.isP,to,year:a.next,pref:a.home.pref,city:a.home.city});
    if(d.kind==='quit'){pipeQuit(W,p,t,d.reason,stage);return;}
    const org=pipeSchOrg(W,d.sid,t);
    P.setAff(W,p.id,org,t,'入学:'+PW2.REASON_JA[d.reason]);P.setCur(W,p.id,'stage',to,t,'進学');
    const ev={t,k:'enroll',stage:to,to:org,sid:d.sid,y:a.next,why:d.reason,cls:d.cls,alts:d.alts};if(d.moved)ev.mv=d.moved;
    P.addEvent(W,p.id,ev);
    const patch={ent:a.next,next:a.next+PIPE_SPAN[to],sid:d.sid};if(d.moved)patch.home=d.moved.to;
    P.setAttr(W,p.id,patch);return;
  }
