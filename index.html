}
/* 期限が来た人物の進学・進路を、人物DBに一度だけ書く。upto = その年度(4月始まり)までに進学する人を対象にする。 */
function pipeAdvance(upto){
  const W=S.world;if(!W)return 0;
  if(KRN.rng.depth<=0)throw new Error('進学の確定はトランザクションの外では行えません');
  const env=pipeEnv();let n=0;
  for(let pass=0;pass<4;pass++){
    let m=0;
    for(const id of Object.keys(W.persons).sort()){
      const p=W.persons[id],a=p.a;
      if(!a||a.next==null||a.next>upto||!p.tags.includes('pipe')||!p.cur.stage)continue;
      pipeStep(W,p,env);m++;
    }
    n+=m;if(!m)break;
  }
  return n;
}
/* ---------- 主人公のチームの名簿に、進学してきた人物を同じ personId で入れる ---------- */
/* 主人公のチームの組織(学校 SCH:/大学・社会人・独立 ORG:/プロ PRO:)。人物DBにまだ無ければ null */
function pipeTeamOrg(W,T0,stage){
  const P=KERNEL.Persons;
  if(stage==='pro')return S.pro&&S.pro.id?P.orgByExt(W,'PRO:'+S.pro.id):null;
  if(stage==='co'||stage==='cp'||stage==='ind')return P.orgByExt(W,'ORG:'+stage+':'+T0.name);
  return T0.sid?P.orgByExt(W,'SCH:'+T0.sid):null;
}
const PIPE_SPAN2={es:4,jh:3,hs:3,co:4,cp:8,ind:6,pro:22};
function pipeInject(T0,stage,year,mode,added){
  const W=S.world;if(!W||!T0.roster)return 0;
  const P=KERNEL.Persons,org=pipeTeamOrg(W,T0,stage);if(!org)return 0;
  const have=new Set(T0.roster.map(m=>m.pid).filter(Boolean));const cand=[];
  for(const id of Object.keys(W.persons).sort()){
    const p=W.persons[id];
    if(!p.a||p.a.ent==null||p.cur.aff!==org.id||p.cur.stage!==stage||!p.tags.includes('pipe')||have.has(id))continue;
    const g=year-p.a.ent+1;if(g<1||g>PIPE_SPAN2[stage]||(mode==='roll'&&g!==1))continue;
    cand.push({p,g:Math.min(g,stage==='co'?4:8)});
  }
  if(!cand.length)return 0;
  const R=T0.roster,n=R.length;
  const slotOk=i=>{const m=R[i];return m&&!m.isMe&&m.id!=='friendM'&&!m.pid&&(mode==='roll'?i>=n-(added||0):i<n-1);};
  const cap=mode==='roll'?added||0:Math.floor(n*.4);let done=0;
  const hero=P.byExt(W,'hero');
  for(const c of cand){
    if(done>=cap)break;
    const pos=c.p.cur.pos||'CF';let idx=-1;
    for(const pass of [0,1,2]){
      for(let i=0;i<n&&idx<0;i++){if(!slotOk(i))continue;const m=R[i];if((pass===0&&m.g===c.g&&m.pos===pos)||(pass===1&&m.g===c.g)||pass===2)idx=i;}
      if(idx>=0)break;
    }
    if(idx<0)break;
    const nm=mkMember(stage,c.g,T0.tier,pos),look=c.p.look;
    Object.assign(nm,{n:c.p.name.full,sur:c.p.name.sur,pid:c.p.id});
    if(look){for(const k of ['hair','skin','fid','hs','eye','tans','num'])if(look[k]!=null)nm[k]=look[k];}
    for(const k of STK)nm.st[k]=clamp(nm.st[k]+(c.p.a.tal-.5)*12,4,96);
    R[idx]=nm;done++;
    if(hero&&P.sharedOrgs(W,hero.id,c.p.id).length){
      const first=P.noteRel(W,hero.id,c.p.id,{k:'former_teammate',s:45},KERNEL.worldTick(S),'同じ学校に進んだ',5);
      if(first==='created'||first==='changed')addMem(`${c.p.name.full}も同じ${T0.name}に進んだ。前の学校で一緒だった仲間と、また同じチームになった。`);
    }
  }
  return done;
}

/* もうこのチームにいない人物(移籍・引退・卒業後の進路)を、名簿から外す */
function pipeDrop(T0,stage){
  const W=S.world;if(!W||!T0.roster)return 0;
  if(!W.orgs)return 0;
  const org=pipeTeamOrg(W,T0,stage);let n=0;
  T0.roster=T0.roster.filter(m=>{
    if(!m.pid)return true;const p=W.persons[m.pid];if(!p||!p.tags.includes('pipe'))return true;
    const stay=org&&p.cur.aff===org.id;if(!stay)n++;return stay;
  });
  return n;
}

/* ===== 高校卒業後の人生(P6) =====
   大学・社会人・独立・プロ・引退を、P5までと同じ personId の履歴につなぐ。進路は KERNEL.Careers が、
   素質・本人の志向・スカウト/推薦/特待/企業の勧誘/ドラフト/就職などの理由とともに決める(導出)。確定(履歴への書き込み)は pipeAdvance がトランザクション内で一度だけ行う。
   - 大学・社会人・独立の組織は、全人物と主人公が共有するマスター(ORG:{段階}:{名前})。プロ球団は PRO:{球団ID}(主人公・ライバル・元チームメイトと同じ組織)。
   - 引退しても人物は消えない: stage='retired'、a.bb='retired'、a.ret={y,org,why}。履歴に retire(引退年・最終所属・理由)を残す。 */
const CAREER_BB={co:'大学',cp:'社会人',ind:'独立リーグ',pro:'プロ'};
const _om={seed:null,lists:{}};
const CO_PRE=['東','西','南','北','中央','帝都','関東','関西','九州','東北','湘南','京阪'],CO_SUF=['学院','工業','経済','体育','商科','国際','総合','文化','教育'];
const CP_PRE=['日の丸','東洋','極東','大和','帝国','潮風','ミドリ','北斗','富士見','青葉','旭日','新生'],CP_SUF=['重工','電機','ガス','製鉄','ビール','海運','自動車','銀行','建設','商事','化学','物産'];
const CO_REG={'東':'関東','西':'近畿','中央':'関東','帝都':'関東','関東':'関東','関西':'近畿','九州':'九州','東北':'東北','湘南':'関東','京阪':'近畿'};
const CO_FIX={'東都学院大':'関東','帝都大':'関東','関西名門大':'近畿','東日本体育大':'東北','中京学院大':'東海','九州国際大':'九州','北都大':'北海道','西日本大':'中国','湘南大':'関東','東北学院大':'東北'};
const IND_REG={'北関東ブリッツ':'関東','信越フォレスターズ':'北信越','四国ブルーオーシャンズ':'四国','九州ファイアーバーズ':'九州','関西ストーンズ':'近畿'};
function careerOrgs(stage){
  const sd=schSeed();if(_om.seed!==sd){_om.seed=sd;_om.lists={};}
  if(_om.lists[stage])return _om.lists[stage];
  const tiers=[1,2,2,3,3,3,4,5];const names=[];
  if(stage==='co'){for(const n of Object.keys(CO_FIX))names.push({name:n,reg:CO_FIX[n],bonus:.5});for(const a of CO_PRE)for(const b of CO_SUF)names.push({name:a+b+'大学',reg:CO_REG[a]||null,bonus:0});}
  else if(stage==='cp'){for(const a of CP_PRE)for(const b of CP_SUF)names.push({name:a+b+'野球部',reg:null,bonus:0});}
  else if(stage==='ind'){for(const n of INDEP)names.push({name:n,reg:IND_REG[n]||null,bonus:0});}
  const seen=new Set(),list=[];
  for(const o of names){if(seen.has(o.name))continue;seen.add(o.name);const s=KERNEL.createStream(sd,'orgbase',stage+':'+o.name);
    list.push({name:o.name,reg:o.reg,base:Math.max(.9,Math.min(5.3,tiers[Math.floor(s.next()*8)]+(s.next()-.5)*.9+o.bonus))});}
  _om.lists[stage]=list;return list;
}
const careerAff=(o,pref)=>o.reg&&o.reg===REGION_OF(pref)?3:o.reg?.6:1;
function careerEnv(){return {orgs:careerOrgs,affinity:careerAff,teams:()=>PRO.map(q=>q.id)};}
const careerOrgOf=(W,stage,name,t)=>KERNEL.Persons.ensureOrg(W,'ORG:'+stage+':'+name,{kind:{co:'college',cp:'corp',ind:'indep'}[stage],name,stage},t).id;
/* 主人公が大学・社会人・独立に進むときのチームを、マスターから選ぶ(トランザクション内・本編の乱数) */
function careerHeroPick(stage,want){
  const list=careerOrgs(stage),ws=list.map(o=>Math.exp(-Math.abs(o.base-want)/.9)*careerAff(o,S.pref));
  let tot=0;ws.forEach(w=>tot+=w);let r=rnd()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i].name;}return list[list.length-1].name;
}
const careerTeamOf=(W,p)=>{const o=p.cur.aff?W.orgs[p.cur.aff]:null;return o&&o.ext.startsWith('PRO:')?o.ext.slice(4):null;};
function careerNews(W,p,tm,via,sch){
  const P=KERNEL.Persons,hero=P.byExt(W,'hero'),mate=hero&&P.sharedOrgs(W,hero.id,p.id).length>0;
  addNews(`${p.name.full}、${tm.n}へ`,`${sch}の${opPosJ(p.cur.pos)}・${p.name.full}が${KERNEL.Careers.MOVE_WHY[via]||'入団'}で${tm.n}に入る。${mate?`${S.name}と同じチームで戦った仲間が`:`${S.name}が対戦した相手が`}、プロの世界へ進む。`);
}
/* 期限が来た高校・大学・社会人・独立・プロの人物の次の一手を、人物DBに一度だけ書く */
function careerStep(W,p,env){
  if(KRN.rng.depth<=0)throw new Error('進路の確定はトランザクションの外では行えません');
  const P=KERNEL.Persons,C=KERNEL.Careers,a=p.a,stage=p.cur.stage,now=KERNEL.worldTick(S);
  const last=p.hist[p.hist.length-1],t=Math.max(Math.min((a.next-2030)*12,now),last?last.t:0),y=a.next;
  const curOrg=p.cur.aff?W.orgs[p.cur.aff]:null;
  const r=C.step(schSeed(),careerEnv(),{key:p.ext,pathKey:/^OP:/.test(p.ext)?p.ext.slice(3):p.ext,tal:a.tal,isP:!!a.isP,pref:a.home.pref,stage,year:y,plan:a.plan||null,team:careerTeamOf(W,p)});
  const schName=curOrg?curOrg.name:'高校';
  if(stage==='hs'){      // 高校卒業時の進路(P4)は、これまでどおり 'path' に残す
    const path=r.path||r.pathTo||'work',team=r.kind==='move'&&r.to==='pro'?r.team:null;
    P.addEvent(W,p.id,{t,k:'path',from:'hs',to:path,why:team?('draft:'+team):'卒業'});
  }
  if(r.kind==='retire'){
    if(p.cur.aff)P.setAff(W,p.id,null,t,'引退:'+r.reason);
    P.setCur(W,p.id,'stage','retired',t,'引退');
    P.addEvent(W,p.id,{t,k:'retire',y,from:stage,last:curOrg?curOrg.id:null,why:r.reason});
    P.setAttr(W,p.id,{next:null,plan:null,bb:'retired',ret:{y,org:curOrg?curOrg.id:null,why:r.reason}});P.addTag(W,p.id,'retired');return;
  }
  if(r.kind==='team'){
    const org=pwProOrg(W,r.team,t);
    P.setAff(W,p.id,org,t,'移籍:'+C.MOVE_WHY[r.via]);
    P.addEvent(W,p.id,{t,k:'career',from:'pro',to:'pro',y,why:r.via,team:r.team});
    P.setAttr(W,p.id,{plan:r.plan,next:r.next});return;
  }
  // 段階を進める
  const org=r.to==='pro'?pwProOrg(W,r.team,t):careerOrgOf(W,r.to,r.org,t);
  P.setAff(W,p.id,org,t,'入団・入学:'+(C.MOVE_WHY[r.via]||r.via));
  P.setCur(W,p.id,'stage',r.to,t,'進路');
  const ev={t,k:'career',from:stage,to:r.to,y,why:r.via};if(r.to==='pro')ev.team=r.team;else ev.org=r.org;
  P.addEvent(W,p.id,ev);
  P.setAttr(W,p.id,{plan:r.plan,next:r.next,ent:y});
  if(r.to==='pro'){
    P.addTag(W,p.id,'pro-bound');if(!p.tags.some(z=>z.startsWith('T:')))P.addTag(W,p.id,'T:'+r.team);
    careerNews(W,p,proOf(r.team),r.via,schName);
  }
}

/* ===== 全国の学校世界(P7) =====
   全国に固定の schoolId を持つ学校群 → 年度Dynasty → 都道府県大会 → 地区大会 → 全国大会、の順に、その年の大会世界を組み立てる。
   - 都道府県大会の結果が土台(主人公が参加した大会は実記録、それ以外は決定論的な導出)。地区・全国大会は、下位の大会の結果から出場校を選んで組み立てる。
     大会のたびに都合のいい学校を生成しない。主人公が参加していない大会も、同じ仕組みで世界の歴史が進む。
   - 導出は純粋(lifeSeed・学校・年度・人物DBの在籍履歴だけで決まる)。表示・一覧取得では何も変わらない。
   - 全国・地区の大会結果は、年度が終わるごとに、トランザクション内で学校史へ一度だけ記録する(worldYearEnd)。
   - 全国の全選手は人物にしない。学校＋年度の集約戦力で進め、主人公と交差した時点で必要な人物だけを決定論的に具体化する(P4)。人物DBにいる選手は、その在籍期間だけ、学校の戦力に効く。 */
/* 強さの差が出場・勝敗に効く度合い(小さいほど番狂わせが起きやすい)。P3の既定(field:0.9 / win:0.75)では、全国優勝の96〜98%を名門が占め、弱小・中堅がほぼ勝てなかった。
   分布の試験(80年・名門の優勝 63%/中堅 30%/弱小 7%、県で最も強い学校の県優勝 約5%)で選んだ。強さは依然として効く(名門は学校の17%だが、全国の出場枠の約44%を占める) */
const W_TUNE={field:0.25,win:0.22,natWin:0.10};
const WREG=['北海道','東北','関東','北信越','東海','近畿','中国','四国','九州'];
const wPrefs=region=>PREF_LIST.filter(p=>REGION_OF(p)===region);
const W_KEYS=new Set(['hs_koshien','hs_sen','hs_fallreg','jh_reg','jh_nat','es_reg','es_nat']);
const W_STAGE={hs_koshien:'hs',hs_sen:'hs',hs_fallreg:'hs',jh_reg:'jh',jh_nat:'jh',es_reg:'es',es_nat:'es'};
const W_LOWER={hs_koshien:'hs_summer',hs_fallreg:'hs_fall',jh_reg:'jh_pref',es_reg:'es_pref'};
const W_PREFN={hs_summer:32,hs_fall:16,jh_pref:16,es_pref:16};
const wRegN=region=>wPrefs(region).length>8?16:8;
const W_NATFAM={hs_koshien:'hs_koshien@*|hs|*|49|64',hs_sen:'hs_sen@*|hs|*|32|32',jh_nat:'jh_nat@*|jh|*|16|16',es_nat:'es_nat@*|es|*|16|16'};
const wFamOf=(k,loc)=>W_NATFAM[k]||`${k}@${loc}|${W_STAGE[k]}|*|${wRegN(loc)}|${wRegN(loc)}`;
const wPrefFam=(kind,pref)=>`${kind}@${pref}|${kind.slice(0,2)}|*|${W_PREFN[kind]}|${W_PREFN[kind]}`;
function wFamParse(fam){const p=fam.split('|');if(p.length!==5)return null;const [k,loc]=p[0].split('@');return {k,loc,stage:p[1],city:p[2],field:+p[3],n:+p[4]};}

/* ---------- 学校の表示名: 全国で同じ名前の学校がある場合だけ、県名を添える(学校IDは変わらない。導出のみ) ----------
   学校名は県内では一意だが、全国では重複する(高校で約580組)。地区・全国大会で同じ名前が並ぶと区別できないため、全国の場で使う名前に県名を添える。 */
let _nc={seed:null,idx:{}};
function schNameCounts(stage){
  const sd=schSeed();if(_nc.seed!==sd){_nc={seed:sd,idx:{}};}
  if(_nc.idx[stage])return _nc.idx[stage];
  const m=new Map();for(const p of PREF_LIST)for(const r of schPrefPool(stage,p))m.set(r.name,(m.get(r.name)||0)+1);
  _nc.idx[stage]=m;return m;
}
function schLabel(sch){
  if(!sch)return '';if(!sch.stage||sch.adopted)return sch.name;
  return (schNameCounts(sch.stage).get(sch.name)||0)>1?sch.name+'（'+prefShort(sch.pref)+'）':sch.name;
}

/* ---------- 人物DBにいる選手が、学校の戦力に効く(在籍期間だけ) ---------- */
let _pi={key:null,map:null};
function schPersonIdx(){
  const W=S&&S.world;if(!W)return null;
  const key=schSeed()+'|'+(W.rev|0)+'|'+W.seq;if(_pi.key===key)return _pi.map;
  const map=new Map(),now=pipeNowYear();
  for(const id of Object.keys(W.persons)){
    const p=W.persons[id];if(!p.a||p.a.tal==null||!p.tags.includes('pipe'))continue;
    let cur=null;const spans=[];
    for(const h of p.hist){if(h.k!=='aff')continue;if(cur){cur.to=h.t;spans.push(cur);cur=null;}if(h.to)cur={org:h.to,from:h.t,to:null};}
    if(cur)spans.push(cur);
    for(const sp of spans){
      const o=W.orgs[sp.org];if(!o||!o.ext.startsWith('SCH:'))continue;
      const sid=o.ext.slice(4),y0=2030+Math.floor(sp.from/12);
      const y1=sp.to==null?(p.a.next!=null?p.a.next-1:now):2030+Math.floor((sp.to-1)/12);
      for(let y=y0;y<=y1;y++){const T=(y-2030)*12;if(sp.from<=T&&(sp.to==null||T<sp.to)){const k=sid+'|'+y;(map.get(k)||map.set(k,[]).get(k)).push({pid:id,tal:p.a.tal});}}
    }
  }
  _pi={key,map};return map;
}
function schPersonDelta(sid,y){
  const m=schPersonIdx();if(!m)return 0;const l=m.get(sid+'|'+y);if(!l)return 0;
  let d=0;for(const x of l)d+=(x.tal-.45)*.3;return Math.max(-.8,Math.min(1,d));
}
const schStrW=(sch,y)=>Math.max(.8,Math.min(5.6,schStrAt(sch,y)+schPersonDelta(sch.sid,y)));
const wStrOf=(sid,y)=>{const s=schGet(sid);return s?schStrW(s,y):2.5;};

/* ---------- 地区・全国大会の出場校(下位の大会の結果から選ぶ) ---------- */
function wRes(fam,y){return KERNEL.TourneyHistory.resultOf(schEnv(),schTHRead(),fam,y);}
function wPrefRes(kind,pref,y){return wRes(wPrefFam(kind,pref),y);}
function wCands(res,y,skip){   // 結果から、勝ち上がった順(深さ→強さ)に並べた出場校
  if(!res)return [];
  return res.f.map((sid,i)=>({sid,d:res.d[i]})).filter(c=>!(skip&&skip.has(c.sid))).sort((a,b)=>b.d-a.d||wStrOf(b.sid,y)-wStrOf(a.sid,y)||(a.sid<b.sid?-1:1));
}
function wFill(core,pools,target,y){
  const out=[],seen=new Set();for(const s of core){if(s&&!seen.has(s)){seen.add(s);out.push(s);}}
  const rest=[];for(const pl of pools)for(const c of pl)if(!seen.has(c.sid))rest.push(c);
  rest.sort((a,b)=>b.d-a.d||wStrOf(b.sid,y)-wStrOf(a.sid,y)||(a.sid<b.sid?-1:1));
  for(const c of rest){if(out.length>=target)break;if(!seen.has(c.sid)){seen.add(c.sid);out.push(c.sid);}}
  return out;
}
function wEntrants(k,loc,y){
  const target={hs_koshien:49,hs_sen:32,jh_nat:16,es_nat:16}[k]||wRegN(loc);
  if(k==='hs_koshien'){      // 夏: 各都道府県の優勝校(東京・北海道は2校)
    const core=[],pools=[];
    for(const p of PREF_LIST){const r=wPrefRes('hs_summer',p,y);if(!r||!r.champ)continue;core.push(r.champ);if((p==='東京都'||p==='北海道')&&r.runner)core.push(r.runner);pools.push(wCands(r,y,new Set([r.champ,r.runner])));}
    return wFill(core,pools,target,y);
  }
  if(W_LOWER[k]){            // 地区大会: 地区内の各都道府県の優勝校＋不足分は準優勝校以下の強い順
    const prefs=wPrefs(loc),core=[],pools=[];
    for(const p of prefs){const r=wPrefRes(W_LOWER[k],p,y);if(!r||!r.champ)continue;core.push(r.champ);pools.push(wCands(r,y,new Set([r.champ])));}
    return wFill(core,pools,target,y);
  }
  const lower={hs_sen:'hs_fallreg',jh_nat:'jh_reg',es_nat:'es_reg'}[k];
  if(lower){                 // 全国(選抜・中学・小学): 地区ごとの優勝校(選抜は準優勝校も)＋不足分は地区大会の上位から
    const core=[],pools=[];
    for(const R of WREG){const r=wRes(wFamOf(lower,R),y);if(!r||!r.champ)continue;core.push(r.champ);if(k==='hs_sen'&&r.runner)core.push(r.runner);pools.push(wCands(r,y,new Set([r.champ,r.runner])));}
    return wFill(core,pools,target,y);
  }
  return null;
}
function wDerive(fam,y){
  const p=wFamParse(fam);if(!p||!W_KEYS.has(p.k))return null;
  const ids=wEntrants(p.k,p.loc,y);if(!ids||ids.length<2)return null;
  return KERNEL.TourneyHistory.bracketResult(schEnv(),fam,y,ids,p.n);
}
/* 主人公が参加する地区・全国大会の出場校(主人公の学校を含む)。トランザクション内でのみ呼ぶ */
function worldHeroField(spec,my){
  if(!(spec.nat||spec.reg)||!W_KEYS.has(spec.key)||!schOn(spec.stage)||!S.world||!my.sid)return null;
  pipeAdvance(S.yr);
  let ids=wEntrants(spec.key,spec.nat?'*':S.region,S.yr);if(!ids||ids.length<4)return null;
  if(!ids.includes(my.sid)){let wi=0,wv=1e9;ids.forEach((id,i)=>{const v=wStrOf(id,S.yr);if(v<wv){wv=v;wi=i;}});ids=ids.slice();ids[wi]=my.sid;}
  return ids;
}
/* ---------- 学校史への記録と、世界の出来事(年度が終わるごと・トランザクション内・冪等) ---------- */
const W_COMMIT=[['hs_koshien','*'],['hs_sen','*'],['jh_nat','*'],['es_nat','*']];
function worldYearEnd(){
  const W=S.world;if(!W)return 0;
  if(KRN.rng.depth<=0)throw new Error('世界の年度更新はトランザクションの外では行えません');
  const cur=pipeNowYear(),TH=schTH(),K=KERNEL.TourneyHistory;let done=0;
  let y=W.wy==null?2030:W.wy+1;
  for(;y<cur;y++){
    for(const [k,loc] of W_COMMIT){
      const fam=wFamOf(k,loc),res=wRes(fam,y);if(!res||res.ghost===0)continue;
      const rec={y,fam,n:res.n,rounds:res.rounds,champ:res.champ,runner:res.runner,f:[],d:[],g:[],bg:1,brief:1,h:K.fingerprint(res)};
      if(K.recordTournament(TH,rec))done++;
    }
    worldNews(y);
    W.wy=y;
  }
  return done;
}
function worldNews(y){
  const P=KERNEL.Persons,W=S.world,K=KERNEL.TourneyHistory,env=schEnv(),TH=schTHRead();
  const hero=P.byExt(W,'hero');let n=0;
  const heroSids=hero?hero.hist.filter(h=>h.k==='aff'&&h.to&&W.orgs[h.to]&&W.orgs[h.to].ext.startsWith('SCH:')).map(h=>W.orgs[h.to].ext.slice(4)):[];
  for(const [k,label] of [['hs_koshien','夏の甲子園'],['hs_sen','春の選抜'],['jh_nat','全国中学野球'],['es_nat','全国学童野球']]){
    if(n>=2)break;const fam=wFamOf(k,'*'),res=wRes(fam,y);if(!res||!res.champ)continue;
    if(res.f.some(s=>heroSids.includes(s))&&res.ghost===0)continue;   // 主人公が参加した大会は、本人の物語として別に語られる
    const ch=schGet(res.champ);if(!ch)continue;const chn=schLabel(ch);
    const ach=K.achievements(env,TH,res,res.champ);
    const beat=heroSids.some(s=>{const h=K.headToHead(TH,s,res.champ);return h.n>0&&h.bw>h.aw;});
    const mates=[];for(const x of (schPersonIdx()||new Map()).get(res.champ+'|'+y)||[]){if(P.sharedOrgs(W,hero.id,x.pid).length)mates.push(W.persons[x.pid].name.full);}
    let t=`${label}は${chn}（${ch.pref}）が制した。${ach.includes('初優勝')?'初優勝だ。':ach.some(a=>/通算/.test(a))?'通算'+ach.find(a=>/通算/.test(a)).replace(/[^\d]/g,'')+'回目の優勝だ。':''}`;
    if(beat)t+=`かつて${S.name}の学校を破った相手が、日本一になった。`;
    if(mates.length)t+=`${mates[0]}（元チームメイト）が通う学校でもある。`;
    addNews(`${label}、${chn}が優勝`,t,'スポーツ日報');n++;
  }
}
/* 学校の「いま」の階層: 主人公の世界と交差している学校は active、それ以外は background(学校＋年度の集約戦力のみ) */
function worldTier(sid,y){
  const idx=schPersonIdx();if(idx&&idx.get(sid+'|'+y))return 'active';
  if(S.team&&S.team.sid===sid)return 'active';return 'background';
}

/* ===== 場面の言葉を、人物・関係・記憶・状況から組み立てる(P8) =====

function adultYearFacts(){

    if(leaves<3)for(const p of Object.values(W.persons)){
      if(p.id===S.heroPid||!p.name.full||PW.affAt(p,now)===orgId)continue;
      // 既存の立場イベントが次年度に返す離脱は、先に別のmemとして保存しない。

        out.push({key:'leave:'+p.id+':'+orgId+':'+h.t,kind:'leave',org:orgId,a:ageNow(),years,rank:1,
          text:org.name+'で'+years+'年以上同じチームにいた'+p.name.full+'が、この年チームを離れた。'});

}

/* ===== 打席の方針の選択肢(P8-②) =====
   選択肢の「並び」と「言い方」は、段階・走者・アウト・点差・イニング・打者のタイプで決まる。打席の結果の計算(確率・能力)は変えていない。
   選択肢の id は従来のまま(meet/power/eye/oppo/bunt)で、効果の計算は 06_match.js のまま。ここでは「何を出すか」と「どう言うか」だけを決める。
   重要な打席(2死得点圏・満塁・終盤の接戦・走者がいる長距離打者)は、「いつもの3択」に戻さず、その局面で意味のある方針にする。結果を約束する言い方にはしない。 */
function abOpts(G,bs,ds,N,batter){
  const st=S.stage,B=G.bases,run=!!(B[0]||B[1]||B[2]),outs=G.outs,d=G.score[bs]-G.score[ds];
  const late=G.inn>=N-2,kid=st==='es',teen=(st==='jh'||st==='hs'),pro=(st==='pro');
  const b=batter.st,strong=b.pow>=b.con+8,fast=b.spd>=55,sacSit=(B[0]||B[1])&&outs<2;
  const behindLate=late&&d<0,leadLate=late&&d>=3,close=Math.abs(d)<=1,home=!!bs;
  const risp=!!(B[1]||B[2]),two=outs===2,loaded=!!(B[0]&&B[1]&&B[2]);
  const crunch=late&&close&&run;                              // 終盤の接戦で走者がいる
  const imp=!kid&&((two&&risp)||loaded||crunch||(strong&&run));    // 重要な打席(小学生は今回は対象外)
  const o=[];
  /* ミート */
  let mt='ミート重視';
  if(kid)mt='ボールをよく見て、当てにいく';
  else if(B[2]&&outs<2)mt='コンパクトに振って、一点を取りにいく';
  else if(imp){
    if(loaded)mt='外野まで運んで、まず一点を取りにいく';
    else if(two&&risp)mt='センター返しで、走者を返しにいく';
    else if(crunch&&home&&d===0)mt='サヨナラの一打を、コンパクトに狙う';
    else if(crunch&&d<0)mt='同点の走者を返しに、確実に捉えにいく';
    else if(crunch&&d===0)mt='勝ち越しの一点を、確実に取りにいく';
    else if(crunch)mt='追加点を、確実に取りにいく';
    else mt='ミートを優先して、走者を返しにいく';
  }
  o.push({id:'meet',t:mt,d:'確実に当てにいく。三振しにくい'});
  /* 強振 */
  if(!leadLate){
    let pw='強振';
    if(kid)pw='思い切り振る';
    else if(imp){
      if(loaded)pw='長打で、走者を一気に返しにいく';
      else if(two&&risp)pw='長打で、一気に返しにいく';
      else if(crunch&&d<0)pw='一発で流れを変える';
      else if(crunch)pw='ここで一気に決めにいく';
      else pw='長打で、走者を一気に返しにいく';
    }
    else if(behindLate)pw='一発で流れを変える';
    else if(strong&&!run)pw='一発を狙う';
    o.push({id:'power',t:pw,d:'長打を狙う。三振のリスクも'});
  }
  /* 見極め */
  if(!kid||behindLate){
    let ey='じっくり見極める';
    if(behindLate&&!imp)ey='何としても塁に出る';
    else if(imp){
      if(loaded)ey='押し出しでもいい。無理に振らない';
      else if(two&&risp)ey=B[0]?'見極めて、つなぐ。四球でも一点につながる':'四球でもいい。つないで次の打者に託す';
      else if(crunch&&d<0)ey='何としても塁に出る';
      else if(crunch)ey='甘い球だけを待って、ボール球は見送る';
      else ey='甘い球を待って、無理に追わない';
    }
    else if(leadLate)ey='無理をせず、確実に出塁する';
    o.push({id:'eye',t:ey,d:'四球を狙う。球を見ていく'});
  }
  /* 進塁打(一死以下) */
  if(run&&outs<2){
    let op=(B[2]&&!B[0]&&!B[1])?'ゴロでもいい。一点を取る':(B[1]&&!B[2])?'右方向に打って、走者を三塁へ':'右方向を狙う';
    if(loaded)op='右方向に転がして、一点を取る';
    o.push({id:'oppo',t:op,d:'進塁打。走者を進めやすい'});
  }
  /* バント: 送りバントは「1塁か2塁に走者・アウトが少ない」とき、点差と打者のタイプを見て出す。プロや強打者は出さない */
  const sacOk=sacSit&&!(late&&d<=-3)&&(kid||teen||(!pro&&!strong)||(pro&&!strong&&outs===0&&Math.abs(d)<=1&&b.pow<45));
  const safeOk=!run&&fast&&!strong&&!leadLate&&(kid||teen||(!pro&&b.spd>=60));
  if(sacOk)o.push({id:'bunt',t:'送りバント',d:'確実に走者を進める'});
  else if(safeOk)o.push({id:'bunt',t:'セーフティバント',d:'足を活かして内野安打を狙う'});
  for(const x of o)x._sit=`${st}|${G.inn}回|${outs}死|${B[0]?'1':'-'}${B[1]?'2':'-'}${B[2]?'3':'-'}|点差${d}|${late?'終盤':'中盤'}|${strong?'長距離':fast?'俊足':'標準'}`;
  return o;
}

/* ===== 投球の方針の選択肢(P8-②) =====
   選択肢の id(power/break/corner/ground/walk)と効果は従来のまま(06_match.js)。ここでは「何を出すか」「どう言うか」だけを、試合の状況で決める。
   使うのは、走者・アウト・点差・イニング・打者のタイプ・主人公の実際の球種だけ。結果を約束する言い方にはしない。
   効果との対応: power=球威(三振↑・被弾↑) / break=変化球(三振↑・四球やや↑) / corner=制球(四球↓) / ground=ゴロ(ゴロ↑・被弾↓・三振↓) */
function pcOpts(G,bs,ds,N,batter,kind,pit){
  const B=G.bases,outs=G.outs,run=!!(B[0]||B[1]||B[2]),risp=!!(B[1]||B[2]),loaded=!!(B[0]&&B[1]&&B[2]),two=outs===2;
  const d=G.score[ds]-G.score[bs],late=G.inn>=N-2,close=Math.abs(d)<=1,bigLead=late&&d>=5,bigBehind=late&&d<=-5;
  const walkOk=!B[0]&&(B[1]||B[2])&&late&&Math.abs(G.score[0]-G.score[1])<=1;
  const br=(pit||[]).slice(1),first=a=>a.find(x=>br.includes(x))||null;
  const whiff=first(['スライダー','フォーク','カーブ','チェンジアップ']),low=first(['フォーク','シンカー','チェンジアップ','ツーシーム','カットボール']),timing=first(['チェンジアップ','カーブ']);
  const slug=kind==='長距離砲',contact=kind==='巧打者';
  /* 力で押す(power) */
  let pw='ストレートで押す';
  if(loaded)pw='三振を狙って、ストレートで押し込む';
  else if(two&&risp)pw=slug?'あと1アウト。ストレートで力勝負（長打は覚悟）':'あと1アウト。ストレートで空振りを取りにいく';
  else if(late&&close)pw=d>0?'勝ちを守る。ストレートで真っ向勝負':d===0?'同点のまま。ストレートで真っ向勝負':'これ以上は許さない。ストレートで真っ向勝負';
  else if(slug)pw='ストレートで力勝負（長打は覚悟）';
  /* 変化球(break): 主人公が実際に投げられる球種を使う */
  let bk='変化球で打ち取る';
  if(loaded&&(low||whiff)){const p=low||whiff;bk=(p==='フォーク'||p==='シンカー'||p==='チェンジアップ')?`${p}を低めに落として、空振りを狙う`:`${p}で空振りを狙う`;}
  else if(two&&risp&&(whiff||timing))bk=`あと1アウト。${whiff||timing}で空振りを取りにいく`;
  else if(contact&&timing)bk=`${timing}でタイミングを外す`;
  else if(whiff)bk=`${whiff}で打ち取る`;
  /* 制球(corner): 効果は四球が減る */
  let cn='コースを突く';
  if(loaded)cn='ストライク先行で、四球を出さない';
  else if(two&&risp)cn='際どいコースを突いて、ミスショットを誘う';
  else if(late&&close)cn='際どいコースを突く。四球は避ける';
  else if(bigLead)cn='大量リード。無駄な四球を出さない';
  else if(bigBehind)cn='これ以上広げない。ストライクを先行させる';
  /* ゴロ(ground): 効果はゴロが増え、被弾が減る */
  let gr='ゴロを打たせる';
  if(loaded&&outs<2&&B[0])gr='ゴロを打たせて、併殺を狙う';
  else if(loaded)gr='ゴロで、あと1アウトを取る';
  else if(two&&risp)gr='詰まらせて、ゴロで終わらせる';
  else if(slug)gr='低めに集めて、長打を避ける';
  else if(bigLead)gr='テンポよく、打たせて取る';
  const o=[{id:'power',t:pw,d:'球威で勝負。三振も増えるが長打も怖い'},{id:'break',t:bk,d:'タイミングを外す'},{id:'corner',t:cn,d:'制球重視で丁寧に'},{id:'ground',t:gr,d:'低めに集めて内野ゴロを誘う'}];
  if(walkOk){for(const x of o)x.t='勝負する：'+x.t;o.push({id:'walk',t:'敬遠して、塁を埋める',d:'勝負を避けて塁を埋める。次の打者と勝負する'});}
  for(const x of o)x._sit=`pc|${G.inn}回|${outs}死|${B[0]?'1':'-'}${B[1]?'2':'-'}${B[2]?'3':'-'}|点差${d}|${late?'終盤':'中盤'}|${kind}`;
  return o;
}

/* ===== 試合前の作戦(P8-②): スタメン野手・先発投手 =====
   「その試合だから考える」作戦にする。使うのは、相手との実力差・大会の重さ・ライバルの有無・主人公が野手か先発投手か、だけ。
   選択肢の効果(b=チーム打撃への加算, p=投手力への加算, rel)は、従来の4つの組を維持している(表示と中身の言い方だけを変える)。
   先発投手は、チーム全体の打撃を動かさない(b=0)。投手本人のゲームプランにする。 */

/* ===== 練習メニューへの「今の課題」の反映(P8-②) =====

   - 課題に対応する練習を先頭に、関連する練習、得意を伸ばす練習の順に出す。ただし課題の練習が唯一の正解にはならない(他の練習も全部残す)。

const TF_MAIN={con:'bat',pow:'power',spd:'run',fld:'field',arm:'throw',velo:'pitch',ctl:'pitch',brk:'pitch',sta:'run'};

/* プロの立場: 二軍=這い上がる／ベンチ=出番に備える／主力=状態を維持して追われる側。効果は既存のまま(表示と並びだけ)。投手には野手専用の表現を出さない */

    let c=0;for(const k of ['bat','field','pitch']){if(c>=2)break;if(k===main||(rel&&rel[0]===k)||!keys.includes(k)||(k==='pitch'&&!isP)||(k==='field'&&isP&&false))continue;

/* 35歳以上: 「伸ばす」から「維持する・整える」へ、言い方を少しずつ変える(崖にはしない)。効果は既存のまま。

/* ===== 親友の卒業後の道(P8) =====

function fpDice(salt){const f=S.people&&S.people.friend;return (Math.abs(hash(`${salt}|${S.name}|${f&&f.n}|${S.sex}|${S.pref}`))%1000)/1000;}
function fpAbility(f){const st=f.st||{};const ks=f.pos==='P'?['velo','ctl','brk','sta']:['con','pow','spd','fld','arm'];return ks.reduce((a,k)=>a+(st[k]!=null?st[k]:40),0)/ks.length;}
function fpOrgName(k,score,salt){
  const stg={college:'co',corp:'cp',indie:'ind'}[k],list=careerOrgs(stg),target=2.6+score*.5;
  const near=list.slice().sort((x,y)=>Math.abs(x.base-target)-Math.abs(y.base-target)).slice(0,10);

function fpAmName(){const L=['フェニックス','サンダース','レッドスターズ','オールドボーイズ','ブルーウェーブ'];return trimCity(S.city||'地元')+L[Math.abs(hash('am|'+S.name+'|'+(S.people.friend&&S.people.friend.n)))%L.length];}

  if(c.k==='college')return txPick('rfC',[`「俺は今、${org}で野球をやってるよ」`,`「大学のグラウンドで、毎日ボールを追ってる。${org}だ」`]);
  if(c.k==='corp')return txPick('rfP',[`「俺は${org}で、仕事と野球の毎日だよ」`,`「会社の野球部で続けてる。夢の続きってほどじゃないけどな」`]);
  if(c.k==='indie')return txPick('rfI',[`「俺は${org}で、まだ上を目指してる」`,`「独立リーグでやってる。バス移動にも慣れたよ」`]);
  if(c.k==='amateur')return txPick('rfA',[`「今は${org}で、週末だけ草野球だ」`,`「仕事のあとに、ボールを追ってる。${org}でな」`]);

  if(info.reason==='hs'){
    if(band==='20')return txPick('rfW1',['「俺は高校を出てから、野球とは縁がなくなっちまってさ」','「卒業してからは、野球はもうやってないんだ。普通に働いてる」']);
    if(band==='30')return txPick('rfW2',[`「俺は高校でやめて、もう${N}年になる。いまは普通に働いてる」`,'「野球からは、ずいぶん遠くなったよ。毎日、仕事で精一杯だ」']);
    return txPick('rfW3',[`「野球をやめて、気づけば${N}年だ。いまは仕事と家のことで手一杯だよ」`,'「俺はもう、ボールを握ることもない。それでも、野球は好きなままだ」']);
  }
  const why={college:'「大学を出るときに、区切りをつけたんだ。いまは普通に働いてる」',corp:'「会社の仕事が忙しくなってな。野球からは、自然と離れた」',indie:'「俺は、ここまでだって区切りをつけたんだ。いまは普通に働いてる」',amateur:'「仕事が忙しくなって、草野球からも足が遠のいたよ」'}[info.reason];

/* P8: 入団した年の名簿を、1度だけ記録する(年度更新の前に呼ぶ)。入団時から一緒だった人物(入団時上位3位の先輩・同期)との別れを、時間経過のある場面にするため */

function stLv(r){r=String(r||'');return /準優勝/.test(r)?5:/優勝/.test(r)?6:/ベスト4|準決勝/.test(r)?4:/ベスト8|準々決勝/.test(r)?3:/3回戦|ベスト16/.test(r)?2:/2回戦/.test(r)?1:0;}

    if(near.length)seeds.push({type:'close',who:near[0],sc:62});

/* 成人非プロの後年の接点。既存人物の共有所属と現在の進路だけを使う。
   候補読取りは純粋。一人生2回まで、再会間隔6年、同じ相手の同じ近況は一度だけ。 */
function lateReunionCands(){
  if(!['cp','ind','am'].includes(S.stage)||ageNow()<30)return [];
  const W=S.world,hero=W&&W.persons[S.heroPid],done=S.flags.lateContacts||[];
  if(!hero||done.length>=2||(done.length&&ageNow()<40))return [];
  const now=pwTick(),myOrg=PW.affAt(hero,now),mine=W.orgs[myOrg];
  if(!mine||!['cp','ind','am'].includes(mine.stage))return [];
  const last=S.flags.txLastReunAge;
  if(last!=null&&ageNow()-last<6)return [];
  const friend=S.people&&S.people.friend,out=[];
  for(const p of Object.values(W.persons)){
    if(p.id===hero.id||!p.name.full||PW.affAt(p,now)===myOrg)continue;
    const rel=PW.relBetween(W,hero.id,p.id);
    const isFriend=friend&&friend.pid===p.id&&rel&&rel.k==='friend';
    if(!isFriend&&(!p.tags.includes('team')||(rel&&rel.k!=='former_teammate')))continue;
    const shared=PW.sharedOrgs(W,hero.id,p.id).filter(x=>x.to!=null&&x.to<=now&&W.orgs[x.org]&&
      x.to-x.from>=(isFriend?3:5)*12).sort((a,b)=>(b.to-b.from)-(a.to-a.from)||a.org.localeCompare(b.org))[0];
    if(!shared)continue;
    let status='',phase='left:'+shared.org+':'+shared.to,evidence;
    if(isFriend){
      const ph=friend.path&&friend.path.ph;
      if(!ph||!ph.length)continue;
      const i=ph.findIndex(x=>ageNow()<x.to),index=i<0?ph.length-1:i,cur=ph[index],prev=ph[index-1];
      if(cur.k==='work'){
        if(p.cur.stage!=='retired')continue;
        status=p.name.full+'は、'+(prev&&prev.org?prev.org+'での野球を終え、':'高校卒業後は野球を離れ、')+'今は働く道を歩んでいる。';
      }else{
        if(!cur.org||!['college','corp','indie','amateur'].includes(cur.k))continue;
        status=p.name.full+'は、今は'+cur.org+'で野球を続けている。';
      }
      phase='path:'+index+':'+cur.k;
      evidence={kind:'path',index,phase:cur.k,org:cur.org||null};
    }else{
      const exit=p.hist.find(h=>h.k==='aff'&&h.from===shared.org&&h.to!==shared.org&&h.t===shared.to);
      if(!exit)continue;
      // 関係値のない成人名簿の人物も、既に本人ID付きで記憶された別れがあれば使える。
      // ただ長く在籍した名簿から、初登場の人物を大量に連れてこない。
      if(!(S.mem||[]).some(m=>m.sc==='adult-year:leave:'+p.id+':'+shared.org+':'+shared.to))continue;
      status=W.orgs[shared.org].name+'を離れた後の再会だった。';
      evidence={kind:'departure',t:exit.t,from:exit.from,to:exit.to};
    }
    const key=p.id+':'+phase;
    if(done.some(x=>x.key===key)||(S.mem||[]).some(m=>m.sc==='adult-year:late-reunion:'+key))continue;
    out.push({key,pid:p.id,rel:isFriend?'friend':'former_teammate',shared:{...shared},evidence,status,
      name:p.name.full,org:W.orgs[shared.org].name,mine:mine.name,year:S.grade,w:isFriend?2:1});
  }
  return out;
}
function lateReunionText(){
  const pool=lateReunionCands();if(!pool.length)return null;
  const r=wpick(pool,x=>x.w);S.flags.txLateReunion=r;

}
const maxKmh=p=>Math.round(veloKmh(p.st.velo));
function pitchPick(p){
  const set=pitchSet(p.n,p.st.brk,S.stage);

  const base=veloKmh(p.st.velo)-(p.fat||0)*.05;

  const P=maxCarry(b.pow),r=rnd();

E({id:'jh_scout',st:'jh',g:[3,3],bg:'ground',actors:['me','coach'],t:'高校のスカウトが来ている',gl:'スカウト',cond:()=>S.fame>=5||myOvr()>=Lbase('jh',3,3)-1,once:true,

E({id:'jh_u15',st:'jh',g:[3,3],bg:'hall',actors:['me','coach'],t:'U-15代表選考',cond:()=>(S.hist||[]).some(x=>/全国　中学校野球大会/.test(x.lab))||myOvr()>=Lbase('jh',3,3)+10,once:true,

E({id:'jh_partner',st:'jh',g:[2,3],bg:'ground',tod:'eve',actors:['me','partner'],t:'フェンスの向こうの声援',once:true,must:true,mustAt:{g:2},skipIf:()=>lifeDice('partner')>=Math.min(.7,.3+(S.fame>=5?.2:0)+(S.rel.team>=60?.1:0)),

E({id:'jh_speed',st:'jh',g:[2,3],bg:'ground',actors:['me','coach'],t:'球速を測ってみよう',cond:()=>S.pos==='P',

E({id:'jh_elbow',st:'jh',g:[2,3],bg:'hospital',actors:['me','mom'],t:'肘の違和感',gl:'肘',cond:()=>S.pos==='P'&&S.st.sta>=30,once:true,

E({id:'jh_winter',st:'jh',g:[1,3],bg:'ground',tod:'morn',season:'winter',actors:['me','coach'],t:'冬の基礎練習',

E({id:'hs_start',st:'hs',g:[1,1],bg:'ground',actors:['me','senior'],t:'高校野球のはじまり',must:true,

E({id:'hs_camp',once:true,st:'hs',g:[1,3],bg:'ground',tod:'eve',actors:['me','coach','senior'],t:'夏合宿・地獄のノック',gl:'ノック',

E({id:'hs_captain',st:'hs',g:[2,3],bg:'ground',actors:['me','coach'],t:'キャプテン指名',gl:'主将',cond:()=>S.rel.coach>=55&&!S.flags.captain&&(role()==='reg'||role()==='ace'),once:true,

E({id:'hs_scoutvisit',st:'hs',g:[3,3],bg:'ground',actors:['me','coach'],t:'プロのスカウトが来ている',gl:'スカウト',cond:()=>myOvr()>=Lbase('hs',3,3)+1||S.fame>=24,once:true,

E({id:'hs_food',st:'hs',g:[1,2],bg:'home',actors:['me','mom'],t:'食トレ',gl:'食トレ',must:true,mustAt:{g:1},skipIf:()=>!(S.st.pow<=45||S.st.sta<=38),

// 同じ冬の練習に描く人物は、その時点の所属履歴で確認する。
function hsWinterFriendHere(){
  const persons=S.world&&S.world.persons;
  const me=persons&&persons[S.heroPid];
  const friend=persons&&S.people.friend&&persons[S.people.friend.pid];
  if(!me||!friend)return false;
  const tick=pwTick(),org=PW.affAt(me,tick);
  return !!org&&PW.affAt(friend,tick)===org;
}

function uniOf(){return S&&S.team?S.team.uni:['#1d4ed8','#ffffff'];}
function look(p,age,opt){
  p=p||{};opt=opt||{};const fid=p.fid!=null?p.fid:hash(p.n||opt.def||'x');let hs=p.hs;
  if(!opt.adult&&['jh','hs'].includes(S.stage)&&(fid%10<7))hs='buzz';
  const tans=p.tans!=null?p.tans:(fid%3);
  const o={fid,hs,eye:p.eye,skin:p.skin,hair:p.hair,tan:tanAmt(tans,opt.indoor)};
  o.tall=opt.adult?(opt.tall!=null?opt.tall:4):heightTall(age,fid);
  return o;
}
function actorSpec(who,x,y,pose,dir){
  const uni=uniOf(),P=S.people||{},A0=ageNow();
  switch(who){
    case 'me':return Object.assign({x,y,s:2,pose:pose||'stand',uni,dir:dir||1,capc:uni[0],mood:'smile'},look({fid:S.fid,hs:S.hs,eye:S.eye,skin:S.skin,hair:S.hairc,tans:S.tans,n:S.name},A0),{num:myNum()});
    case 'coach':return Object.assign({x,y,s:2,big:true,uni,top:'#243b6b',pants:'#2f3b52',capc:uni[0],dir:dir||-1,pose:'stand',adult:true,mood:'normal'},look(P.coach,0,{adult:true,tall:4,def:'c'}),{hair:'#8a8f98',tan:.32});
    case 'friend':return Object.assign({x,y,s:2,uni,pose:'stand',dir:dir||-1,mood:'smile',num:(P.friend.num===myNum()?P.friend.num+1:P.friend.num)},look(P.friend,A0));
    case 'rival':{const u=UNIS[hash(P.rival.n)%UNIS.length];return Object.assign({x,y,s:2,uni:u,capc:u[0],pose:'stand',dir:dir||-1,mood:'angry',num:P.rival.pos==='P'?1:(P.rival.num||4)},look(P.rival,A0));}
    case 'senior':return Object.assign({x,y,s:2,uni,pose:'stand',dir:dir||-1,mood:'smile',num:P.senior.num||3},look(P.senior,A0+2,{def:'s'}));
    case 'dad':return Object.assign({x,y,s:2,big:true,cap:false,top:'#5b6b8a',pants:'#3a3f4d',dir:dir||-1,pose:'stand',adult:true,mood:'smile'},look(P.dad,0,{adult:true,tall:5,indoor:true}));
    case 'mom':return Object.assign({x,y,s:2,big:true,cap:false,top:'#d97b9a',pants:'#6b4e71',apron:true,dir:dir||-1,pose:'stand',adult:true,mood:'smile'},look(P.mom,0,{adult:true,tall:3,indoor:true}),{hs:'long'});
    case 'partner':return Object.assign({x,y,s:2,cap:false,top:'#f2b84b',pants:'#475569',dir:dir||-1,pose:'stand',mood:'smile'},look(P.partner,A0,{adult:A0>=18,tall:3,indoor:true}),{hs:P.partner&&P.partner.hs==='short'?'short':'long'});
  }

/* スロット選択。mode='new'は空き/上書き、'cont'は使用済みのみ。選んだ番号(なければnull)を返す。 */
function pickSlot(mode){
  return new Promise(async res=>{
    const el=$('#title');el.classList.add('on');
    const L=await KRN.slots();
    const cards=L.map(x=>{
      const used=!!x.header,dis=(mode==='cont'&&!used);
      return `<button class="btn ${used?'':'dm'}" data-s="${x.slot}" ${dis?'disabled':''} style="text-align:left;margin-bottom:6px;${dis?'opacity:.4':''}"><b>スロット${x.slot}</b>　${esc(slotSummary(x.header))}${used&&!x.header.broken?`<br><span class="dm" style="font-size:11px">最終保存 ${slotDate(x.header)}　バックアップ${x.backups}世代</span>`:''}</button>`;
    }).join('');
    el.innerHTML=`<div class="sp" style="padding:16px"><h1>${mode==='new'?'どこに保存しますか':'どの人生の続きですか'}</h1><div class="sub">${mode==='new'?'使用済みのスロットを選ぶと、その人生は消えて上書きされます。':'オートセーブは、すべての区切りで自動的に行われます。'}</div><div style="height:8px"></div>${cards}<button class="btn" id="slotBack" style="text-align:center;margin-top:6px">← タイトルへ</button></div>`;
    $('#slotBack').onclick=()=>{A.sfx('back');res(null);};
    el.querySelectorAll('[data-s]').forEach(b=>{b.onclick=async()=>{
      const slot=+b.dataset.s;const used=!!L[slot-1].header;
      if(mode==='new'&&used){
        el.innerHTML=`<div class="sp" style="padding:16px"><div class="card" style="text-align:center;font-size:14px;line-height:1.7">スロット${slot}の人生は、<br><b class="bad">消えて上書き</b>されます。<br>${esc(slotSummary(L[slot-1].header))}</div><button class="btn pri" id="ovY">はい、上書きして始める</button><button class="btn" id="ovN" style="text-align:center;margin-top:6px">やめる</button></div>`;
        $('#ovY').onclick=()=>{A.sfx('ok');res(slot);};$('#ovN').onclick=()=>{A.sfx('back');res(null);};
      }else{A.sfx('ok');res(slot);}
    };});
  });
}

function addMem(t,sc){

}

function applyFx(fx,rel,ex){
  const L=[];
  for(const k in (fx||{})){const v=fx[k];
    if(STK.includes(k)){const cap=Math.max(S.pot[k]+3,S.st[k]);const nv=clamp(S.st[k]+v,0,cap);const d=nv-S.st[k];S.st[k]=nv;if(Math.abs(v)>=1)L.push(`${STN[k]} ${v>0?'+':''}${v}`);}
    else if(k==='gak'){S.gak=clamp(S.gak+v,0,100);L.push(`学力 ${v>0?'+':''}${v}`);}
    else if(k==='cond'){S.cond=clamp(S.cond+v,0,100);L.push(`体調 ${v>0?'+':''}${v}`);}
    else if(k==='fame')S.fame+=v;
  }
  const rl=[];
  for(const k in (rel||{})){const v=rel[k];S.rel[k]=clamp((S.rel[k]||0)+v,0,100);if(Math.abs(v)>=3)rl.push(`${REL_L[k]||k} ${v>0?'♥':'💔'}`);}
  if(ex){if(ex.f)S.flags[ex.f]=true;if(ex.mem)addMem(ex.mem);if(ex.pos){if(ex.pos==='rand'){const c=POSLIST.filter(p=>p!=='P'&&p!==S.pos);S.pos=pick(c);L.push('守備位置 → '+POSN[S.pos]);}else{S.pos=ex.pos;}}}
  return {lines:L,rel:rl};
}

}
function brkHtml(V){
  const n=V.n,k=Math.round(Math.log2(n));
  const W=n<=4?56:n<=8?44:n<=16?28:n<=32?20:16,fs=n<=16?11:10,cap=n<=8?12:n<=16?10:8;
  const padL=10,padR=10,H=n<=16?26:22,top=40;
  const nm=t=>{const s=String(t.name).replace(/ー/g,'｜');return Array.from(s).slice(0,cap);};
  let maxc=1;V.teams.forEach(t=>{maxc=Math.max(maxc,nm(t).length);});
  const showRep=new Set(V.teams.filter(t=>!t.bye).map(t=>t.rep)).size>1;
  const rfs=n<=16?9:8;let maxr=0;if(showRep)V.teams.forEach(t=>{maxr=Math.max(maxr,Array.from(t.rep||'').length);});
  const yLeaf=top+k*H,yNames=yLeaf+8,repY=yNames+maxc*(fs+1)+6,height=(showRep?repY+maxr*(rfs+1)+34:yNames+maxc*(fs+1)+28),width=padL+padR+n*W;
  const Wn=(r,j)=>{const a=V.br[r];return a&&a[j]!=null?a[j]:undefined;};
  const nx=(r,j)=>padL+(j*Math.pow(2,r)+Math.pow(2,r)/2)*W,ny=r=>yLeaf-r*H;
  const RED='#ff3b3b',GRY='#8fa4ff',DIM='#3a4a9a';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="display:block" data-red="__RED__">`;
  let red=0;const paths=[];
  for(let r=0;r<k;r++){const cnt=n/Math.pow(2,r);
    for(let j=0;j<cnt;j++){
      const w=Wn(r,j),pw=Wn(r+1,j>>1);
      let col,sw;
      if(pw===undefined){col=DIM;sw=1.2;}
      else if(w!==undefined&&pw===w){col=RED;sw=2.6;red++;}
      else{col=GRY;sw=1.4;}
      const x=nx(r,j),px=nx(r+1,j>>1);
      paths.push({col,d:`M${x},${ny(r)} L${x},${ny(r+1)} L${px},${ny(r+1)}`,sw});
    }}
  paths.sort((a,b)=>(a.col===RED)-(b.col===RED)); /* 赤線を最前面に */
  paths.forEach(q=>{s+=`<path d="${q.d}" fill="none" stroke="${q.col}" stroke-width="${q.sw}" stroke-linecap="square"/>`;});
  const champ=Wn(k,0);
  if(champ!==undefined){s+=`<path d="M${nx(k,0)},${ny(k)} L${nx(k,0)},${ny(k)-14}" stroke="${RED}" stroke-width="2.6" fill="none"/>`;red++;
    const t=V.teams[champ];s+=`<text x="${Math.min(Math.max(nx(k,0),60),width-60)}" y="12" fill="${t.me?'#ffd23f':'#fff'}" font-size="12" text-anchor="middle" font-weight="bold">🏆 優勝 ${esc(String(t.name).slice(0,12))}${t.rep&&showRep?'（'+esc(t.rep)+'）':''}</text>`;}
  V.teams.forEach((t,i)=>{
    if(t.bye)return;
    const x=nx(0,i);const col=i===V.my?'#ffd23f':i===V.nxt?'#58e0ff':'#e8ecff';
    const chars=nm(t);
    chars.forEach((c,ci)=>{s+=`<text x="${x}" y="${yNames+(ci+1)*(fs+1)-2}" fill="${col}" font-size="${fs}" text-anchor="middle" font-weight="${i===V.my||i===V.nxt?'bold':'normal'}">${esc(c)}</text>`;});
    if(i===V.nxt)s+=`<text x="${x}" y="${yLeaf+6}" fill="#58e0ff" font-size="8" text-anchor="middle">▲</text>`;
    if(showRep&&t.rep)Array.from(t.rep).forEach((c,ci)=>{s+=`<text x="${x}" y="${repY+(ci+1)*(rfs+1)-1}" fill="${i===V.my?'#ffd23f':'#7fd3ff'}" font-size="${rfs}" text-anchor="middle">${esc(c)}</text>`;});
    const by=(showRep?repY+maxr*(rfs+1)+10:yNames+maxc*(fs+1)+10);
    if(t.prev)s+=`<text x="${x}" y="${by+(t.star&&i!==V.my?12:0)}" fill="${t.prev==='優勝'?'#ffd23f':'#cbd5e1'}" font-size="10" text-anchor="middle">${t.prev==='優勝'?'◆':'◇'}</text>`;
    if(t.star&&i!==V.my)s+=`<text x="${x}" y="${by}" fill="#ff9d3b" font-size="9" text-anchor="middle">★</text>`;
  });

async function runLoop(){
  if(LOOP_BUSY)return;               // 二重起動(ダブルタップ・再入)を拒否
  LOOP_BUSY=true;let fails=0;
  try{
    for(;;){
      let st;
      try{st=await stepBeat();}
      catch(e){
        if(window.__TEST||(KERNEL.Crash&&e instanceof KERNEL.Crash))throw e;
        window.__ERR=String(e.stack||e);console.error(e);
        await KRN.restore();           // 最後にCOMMITされた状態へ戻す
        if(++fails>=2){alert('エラーが続いたため、最後の保存地点に戻してタイトルへ戻ります。');location.reload();return;}
        continue;
      }
      if(st==='end'){await endingScreens();return;}
      if(st==='busy'){await new Promise(rs=>setTimeout(rs,30));continue;}
      fails=0;
      KRN.hooks.at('render',{});
    }
  }finally{LOOP_BUSY=false;}
}

  let c=pool.filter(e=>!e.must&&!rec.includes(e.id)&&cool(e));

  if(!c.length)c=pool.filter(e=>!e.must&&!rec.includes(e.id));
  if(!c.length)c=pool.filter(e=>!e.must);

    const c2=c.filter(e=>!e.cat||e.cat!==S.lastCat);if(c2.length)c=c2;      // 同じ種類の出来事を続けない

async function animateRes(f,M){
  setView(gameView(f,M,'duel'));const g=VIEW.game;const a=f.anim;

  const tx=look?84:122,ty=a.kind==='bb'?116:look?140:138;

function leagueBoard(){

/* 自分の順位(同値は同順位=タイトル共有)。未出場・二軍は対象外 */
function leagueRanks(LB,r2,role){
  const bt=r2.bat,pt=r2.pit,R={},V={};
  if(role==='farm')return {R,V,lead:{}};
  const lead={};
  const best=(arr,f,dir)=>{let b=null;arr.forEach(x=>{if(!b||(dir>0?f(x)>f(b):f(x)<f(b)))b=x;});return b;};
  if(bt.pa>=200){
    const avg=bt.ab?bt.h/bt.ab:0;
    if(bt.pa>=Q_PA){R.avg=1+LB.H.filter(x=>x.pa>=Q_PA&&x.avg>avg+1e-9).length;V.avg=avg;lead.avg=best(LB.H.filter(x=>x.pa>=Q_PA),x=>x.avg,1);}
    R.hr=1+LB.H.filter(x=>x.hr>bt.hr).length;V.hr=bt.hr;lead.hr=best(LB.H,x=>x.hr,1);
    R.rbi=1+LB.H.filter(x=>x.rbi>bt.rbi).length;V.rbi=bt.rbi;lead.rbi=best(LB.H,x=>x.rbi,1);
  }
  if(pt.bf>=150){
    const era=pt.out?pt.er*27/pt.out:99;
    if(pt.out>=Q_OUT){R.era=1+LB.P.filter(x=>x.out>=Q_OUT&&x.era<era-1e-9).length;V.era=era;lead.era=best(LB.P.filter(x=>x.out>=Q_OUT),x=>x.era,-1);}
    R.w=1+LB.P.filter(x=>x.w>pt.w).length;V.w=pt.w;lead.w=best(LB.P,x=>x.w,1);
    R.so=1+LB.P.filter(x=>x.so>pt.so).length;V.so=pt.so;lead.so=best(LB.P,x=>x.so,1);
  }
  return {R,V,lead};
}

/* P8: 名声のドラフト評価への加点には上限を設ける。「有名だから球団が注目する」には効くが、過去の名声だけで現在の戦力評価が1位級になってはいけない

const DRAFT_FAME_CAP=10;

function draftClass(src){

function draftRoundOf(rank){return rank<=84?Math.ceil(rank/12):rank<=105?0:-1;}

function draftEstimate(src){

  const round=draftRoundOf(rank);
  return {rank,round,score:s};

function estLabel(e){return e.round>0?(e.round<=1?'1位指名級の評価':e.round<=3?`${e.round}位前後での指名が見込まれる`:`${e.round}位あたりでの指名の可能性`):e.round===0?'育成枠での指名がありえる評価':'指名はかなり厳しい評価';}
/* P8: 「今後を考える」を出す年か。毎年ではなく、考える理由がある年だけ。
   理由: ①初めて ②所属が変わった ③プロ挑戦が出せる年(従来どおり) ④プロ挑戦が現実的でなくなった ⑤年齢の節目(30・35・40歳をまたいだ) ⑥評価の区分が変わった(前回から3年以上) ⑦前回から4年たった。
   前回表示した年・状態を1つ(S.flags.futureLast)保存する。引退を選べる機会は、少なくとも節目と4年ごとに残る。 */
function futureWhy(src,est,dc){
  const age=ageNow(),cls=est.round>=1?'hi':est.round===0?'dev':'lo',F=S.flags.futureLast,team=S.team?S.team.name:'';
  let why=null;
  if(dc.ok)why='draft';
  else if(!F)why='first';
  else if(F.team!==team||F.src!==src)why='team';
  else if(F.ok&&!dc.ok)why='closed';
  else if([30,35,40].some(m=>F.a<m&&m<=age))why='milestone';
  else if(F.cls!==cls&&age-F.a>=3)why='eval';           // 評価の見積もりには揺らぎがあるので、区分が変わっても、前回から3年空ける
  else if(age-F.a>=4)why='years';
  if(!why)return null;
  S.flags.futureLast={a:age,ok:!!dc.ok,cls,team,src};
  (S.flags.futureLog=S.flags.futureLog||[]).push({a:age,why});
  return why;
}
/* P8: 社会人・独立の選手が、今年「プロ志望届を出す」選択肢を持てるか。
   年齢が上がるほど、相応の評価が必要。再挑戦(過去に挑戦したことがある)は、「前回より評価が上がった」「まだ若い」「間を空けた」のどれかの理由が必要。 */
function draftChallenge(est){
  const age=ageNow(),r=est.round,rank=est.rank,tries=S.flags.draftTries|0,last=S.flags.draftLast;
  const ageOk=draftAgeOk(age,r,rank);
  if(!ageOk)return {ok:false};
  if(!tries||!last)return {ok:true,why:'first',note:''};
  if(rank<=last.rank-12)return {ok:true,why:'improved',note:'去年より、評価が上がった。もう一度だけ、プロを目指せる。'};
  if(age<=24)return {ok:true,why:'young',note:''};
  if(age-last.a>=3)return {ok:true,why:'gap',note:'時間は空いたが、まだ可能性はある。'};
  return {ok:false};
}

/* ===== アメリカリーグ挑戦(GPT版 db/themes/yakyu/overseas.js のルールを移植) =====

const OS_MIN=400,OS_MAX=400000,OS_BASE=600,OS_SPAN=300000;

const osMarket=perf=>OS_BASE+Math.pow(clamp((perf-20)/80,0,1),1.6)*OS_SPAN;
const fmtSal=m=>m>=10000?`${(m/10000).toFixed(m>=100000?0:1)}億円`:`${Math.round(m).toLocaleString()}万円`;
const avgPot=()=>(S.pos==='P'?['velo','ctl','brk']:['con','pow','spd']).reduce((a,k)=>a+S.pot[k],0)/3;
function perfNow(aw){return clamp(42+(myOvr()-proL(proOf(S.pro.id)))*2.4+((aw&&aw.length)||0)*7+(S.pro.role==='star'?8:S.pro.role==='reg'?4:S.pro.role==='farm'?-8:0),0,100);}
function roleExp(skill,interest){if(skill>=70&&interest>=70)return 'star';if(skill>=55)return 'regular';if(skill>=40)return 'rotation';if(interest>=50)return 'bench';return 'development';}
function mkOffers(pool,perf,toUS){
  const skill=myOvr(),pot=avgPot(),age=ageNow(),out=[];
  pool.forEach(tm=>{
    const interest=clamp(50+(skill-tm.pw+(toUS?15:25))*1.6+(pot-60)*.3+(age<=27?5:age>=33?-8:0)+gauss()*6,0,100);
    if(interest<25)return;

const offerOpts=os=>os.map(o=>({t:o.tm.n+(o.dom?'（日本復帰）':''),d:`年俸${fmtSal(o.sal)}・${o.yrs}年・${ROLE_JA[o.role]}`}));

/* P8: 「決断の時」(引退を考える節目)を出す年か。34歳以上というだけでは毎年出さない。キャリアの転換点が近づいた年だけ:
   評価が落ちた(40点未満)・立場が下がった(前年より役割が低い)・評価が急に下がった(前年より25点以上)・二軍のいずれか。

   「引退の二文字」(一度きりの出来事)と同じシーズンには、同じことを問わない(「決断の時」の直後の同じ年齢には、「引退の二文字」を出さない)。状態の変化が主で、間隔は補助。 */
const PRO_ROLE_RANK={farm:0,bench:1,reg:2,star:3};

  const P=S.pro;if(!P)return false;const age=ageNow();if(age<34)return false;
  const perf=P.lastPerf!=null?P.lastPerf:50;if(perf>=70)return false;
  const H=P.perfHist||[],prev=H.length>=2?H[H.length-2]:null,rk=r=>PRO_ROLE_RANK[r]!=null?PRO_ROLE_RANK[r]:2;
  const roleDown=!!P.prevRole&&rk(P.role)<rk(P.prevRole),drop=prev!=null&&prev-perf>=25,weak=perf<40,farm=P.role==='farm';
  if(!(roleDown||drop||weak||farm))return false;
  if(S.evYr&&S.evYr.pro_retire!=null&&S.yr===S.evYr.pro_retire)return false;      // 「引退の二文字」と同じシーズンには、同じことを問わない
  const L=S.flags.crossLast;if(L&&age-L.age<3){const worse=rk(P.role)<rk(L.role)||perf<=L.perf-25;if(!worse)return false;}
  return true;
}

  const achievement=m=>m.t.split('・').length+(/獲得した/.test(m.t)?3:/優勝/.test(m.t)?2:1);
  add(achievements.reduce((a,b)=>!a||achievement(b)>achievement(a)?b:a,null));

/* ---- 練習試合・リーグ戦などの年間成績(自動進行) ---- */
function simPractice(){
  const stg=S.stage;if(!['es','jh','hs'].includes(stg))return 0;
  const n={es:9,jh:12,hs:20}[stg];const role=roleForSeason();const isP=S.pos==='P';let cnt=0;
  const g=stg==='es'?5:2;
  for(let i=0;i<n;i++){const mr=partRole(role,isP);if(!mr||S.inj)continue;const meta=makeMeta(stg,pick([2,3,3,4]),null,{g,scope:stg==='hs'?null:'city'});const r=autoGame(meta,stg,mr);recordGame(r);cnt++;}
  return cnt;
}
